{{- $username := toString .Values.minio.auth.rootUser }}
{{- $password := toString .Values.minio.auth.rootPassword }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (include "noah.minioSecretName" .)) | default dict }}
{{- $existingData := (get $existingSecret "data") | default dict }}
{{- if hasKey $existingData "accessKey" }}
{{- $username = get $existingData "accessKey" | b64dec }}
{{- end }}
{{- if hasKey $existingData "secretKey" }}
{{- $password = get $existingData "secretKey" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noah.minioSecretName" . }}
  labels:
    {{- include "noah.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ $username | quote }}
  secretKey: {{ $password | quote }}
