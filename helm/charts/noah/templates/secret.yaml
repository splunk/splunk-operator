{{- $auth := dict
  "database" (toString .Values.postgresql.auth.database)
  "username" (toString .Values.postgresql.auth.username)
  "password" (toString .Values.postgresql.auth.password)
}}
{{- $existingConfigMap := (lookup "v1" "ConfigMap" .Release.Namespace (include "noah.envConfigMapName" .)) | default dict }}
{{- $existingConfigData := (get $existingConfigMap "data") | default dict }}
{{- if hasKey $existingConfigData "NOAH_DB" }}
{{- $_ := set $auth "database" (get $existingConfigData "NOAH_DB") }}
{{- end }}
{{- if hasKey $existingConfigData "NOAH_DB_USER" }}
{{- $_ := set $auth "username" (get $existingConfigData "NOAH_DB_USER") }}
{{- end }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (include "noah.databaseSecretName" .)) | default dict }}
{{- $existingSecretData := (get $existingSecret "data") | default dict }}
{{- if hasKey $existingSecretData "POSTGRES_DB" }}
{{- $_ := set $auth "database" (get $existingSecretData "POSTGRES_DB" | b64dec) }}
{{- end }}
{{- if hasKey $existingSecretData "NOAH_DB" }}
{{- $_ := set $auth "database" (get $existingSecretData "NOAH_DB" | b64dec) }}
{{- end }}
{{- if hasKey $existingSecretData "POSTGRES_USER" }}
{{- $_ := set $auth "username" (get $existingSecretData "POSTGRES_USER" | b64dec) }}
{{- end }}
{{- if hasKey $existingSecretData "NOAH_DB_USER" }}
{{- $_ := set $auth "username" (get $existingSecretData "NOAH_DB_USER" | b64dec) }}
{{- end }}
{{- if hasKey $existingSecretData "POSTGRES_PASSWORD" }}
{{- $_ := set $auth "password" (get $existingSecretData "POSTGRES_PASSWORD" | b64dec) }}
{{- end }}
{{- if hasKey $existingSecretData "NOAH_DB_PASSWORD" }}
{{- $_ := set $auth "password" (get $existingSecretData "NOAH_DB_PASSWORD" | b64dec) }}
{{- end }}
{{- if not (get $auth "password") }}
{{- $_ := set $auth "password" (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noah.databaseSecretName" . }}
  labels:
    {{- include "noah.labels" . | nindent 4 }}
type: Opaque
stringData:
  NOAH_DB: {{ get $auth "database" | quote }}
  NOAH_DB_USER: {{ get $auth "username" | quote }}
  NOAH_DB_MASTER_USER: {{ get $auth "username" | quote }}
  NOAH_DB_PASSWORD: {{ get $auth "password" | quote }}
  POSTGRES_DB: {{ get $auth "database" | quote }}
  POSTGRES_USER: {{ get $auth "username" | quote }}
  POSTGRES_PASSWORD: {{ get $auth "password" | quote }}
