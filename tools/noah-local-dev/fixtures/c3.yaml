---
apiVersion: enterprise.splunk.com/v4
kind: NoahCluster
metadata:
  name: c3
spec:
  # This plain YAML is not affected by NOAH_LOCAL_NAMESPACE,
  # NOAH_LOCAL_RELEASE or NOAH_LOCAL_PORT overrides.
  endpoint: http://noah.splunk-operator.svc:8443
  tenant: axolotl
  authSecretRef:
    name: noah-auth

---
apiVersion: enterprise.splunk.com/v4
kind: LicenseManager
metadata:
  name: c3
spec:
  volumes:
    - name: licenses
      secret:
        secretName: splunk-license
  licenseUrl: /mnt/licenses/enterprise.lic
  etcVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 10Gi
  varVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 20Gi
  defaults: |
    splunk:
      conf:
        web:
          content:
            settings:
              startwebserver: "false"

---
apiVersion: enterprise.splunk.com/v4
kind: IndexerCluster
metadata:
  name: c3
spec:
  replicas: 2
  serviceAccount: ${NOAH_SPLUNK_SERVICE_ACCOUNT}
  noahClusterRef:
    name: c3
  licenseManagerRef:
    name: c3
  extraEnv:
    - name: AWS_DEFAULT_REGION
      value: ${NOAH_SMARTSTORE_AUTH_REGION}
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  etcVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 10Gi
  varVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 20Gi
  defaults: |
    splunk:
      conf:
        server:
          content:
            noahService:
              enableBatchRoll: "true"
              # Remote-bundle initialization is not part of the M1 lifecycle contract.
              waitForRemoteBundleInit: "false"
            general:
              site: site1
            kvstore:
              disabled: "true"
            noah_indexer_client:
              clustered_bucket_database_granularity: index
        indexes:
          content:
            "volume:remote_store":
              storageType: remote
              path: ${NOAH_SMARTSTORE_OBJECT_STORE_PATH}
              "remote.s3.endpoint": ${NOAH_SMARTSTORE_OBJECT_STORE_ENDPOINT}
              "remote.s3.signature_version": v4
              "remote.s3.auth_region": ${NOAH_SMARTSTORE_AUTH_REGION}
              "remote.s3.sqs.endpoint": ${NOAH_SMARTSTORE_QUEUE_ENDPOINT}
              "remote.s3.sqs.queue_url": ${NOAH_SMARTSTORE_QUEUE_URL}
              "remote.s3.supports_versioning": "false"
            main:
              remotePath: volume:remote_store/main
              "hotBucketStreaming.sendSlices": "true"
              "hotBucketStreaming.reportStatus": "true"
              "hotBucketStreaming.removeRemoteSlicesOnRoll": "true"
              "hotBucketStreaming.removeRemoteSlicesOnFreeze": "true"
              "hotBucketStreaming.deleteHotsAfterRestart": "true"
        web:
          content:
            settings:
              startwebserver: "false"
        restmap:
          content:
            # TODO: Remove once splunk-ansible defaults this stanza for Noah workloads.
            "admin:certificates":
              authKeyStanza: noahService
            "streams:search":
              authKeyStanza: noahService
            "streams:rdin":
              authKeyStanza: "parallelreduce noahService"

---
apiVersion: enterprise.splunk.com/v4
kind: SearchHeadCluster
metadata:
  name: c3
spec:
  replicas: 3
  noahClusterRef:
    name: c3
  licenseManagerRef:
    name: c3
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  etcVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 10Gi
  varVolumeStorageConfig:
    ephemeralStorage: false
    storageClassName: gp3-automode
    storageCapacity: 20Gi
  defaults: |
    splunk:
      conf:
        server:
          content:
            general:
              site: site1
        web:
          content:
            settings:
              startwebserver: "false"
        restmap:
          content:
            # TODO: Remove once splunk-ansible defaults this stanza for Noah workloads.
            "admin:certificates":
              authKeyStanza: noahService
            "streams:search":
              authKeyStanza: noahService
            "streams:rdin":
              authKeyStanza: "parallelreduce noahService"
