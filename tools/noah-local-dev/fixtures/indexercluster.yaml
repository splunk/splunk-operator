---
apiVersion: enterprise.splunk.com/v4
kind: IndexerCluster
metadata:
  name: test
spec:
  replicas: 2
  noahClusterRef:
    name: noah
  # Carries the splunk-ansible changes needed to test Noah. Drop this once
  # CSPL-5172 lands and the official image works. Overrides
  # RELATED_IMAGE_SPLUNK_ENTERPRISE.
  image: docker-test.repo.splunkdev.net/user-vivekr/splunk-cloud:noah-splunk-provision-0481b19
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi
  etcVolumeStorageConfig:
    ephemeralStorage: true
    storageClassName: ""
    storageCapacity: ""
  varVolumeStorageConfig:
    ephemeralStorage: true
    storageClassName: ""
    storageCapacity: ""
  defaults: |
    splunk:
      conf:
        server:
          content:
            general:
              site: site1
            kvstore:
              disabled: "true"
        web:
          content:
            settings:
              startwebserver: "false"

---
apiVersion: enterprise.splunk.com/v4
kind: NoahCluster
metadata:
  name: noah
spec:
  # This branch's CRD requires `endpoint`; `serviceURL` is pruned and rejected.
  # Resolved in-cluster by DNS and locally through the port-forward, so the one
  # value works from both sides. See tools/noah-local-dev/README.md.
  #
  # This is plain YAML, so nothing here is templated. Overriding
  # NOAH_LOCAL_PORT or NOAH_LOCAL_NAMESPACE moves the chart Service and the
  # port-forward but not this line: keep <release>.<namespace>.svc:<port> in
  # step, or point NOAH_LOCAL_FIXTURES at your own copy.
  endpoint: http://noah.splunk-operator.svc:8443
  tenant: axolotl
  authSecretRef:
    name: noah-auth
