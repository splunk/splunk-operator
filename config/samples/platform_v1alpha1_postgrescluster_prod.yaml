# Image template: set TEST_PG17_IMAGE and TEST_PGBOUNCER_IMAGE
# to complete tag@sha256 references.
# Render with envsubst before applying.
# Unrendered placeholders are not valid images.
# This is a sample PostgresCluster manifest with default values for all fields. 
# Defaults are inherited from the ClusterClass "postgresql-dev" (see enterprise_v4_clusterclass_dev.yaml) and can be overridden here.
apiVersion: platform.splunk.com/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: splunk-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgresql-cluster-prod
spec:
  images:
    postgresql:
      "17": ${TEST_PG17_IMAGE}
    pgbouncer: ${TEST_PGBOUNCER_IMAGE}
    # Optional Secrets must exist in this PostgresCluster's namespace.
    # imagePullSecrets:
    #   - name: registry-reader
  class: postgresql-prod
  # Create PostgresDatabase resources that reference this cluster for application databases and roles.
  instances: 1

