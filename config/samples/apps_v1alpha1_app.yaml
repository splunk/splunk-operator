apiVersion: apps.splunk.com/v1alpha1
kind: App
metadata:
  labels:
    app.kubernetes.io/name: splunk-operator
    app.kubernetes.io/managed-by: kustomize
  name: app-sample
spec:
  appID: sample-app
  version: "1.0.0"
  targetRef:
    kind: Standalone
    name: standalone-sample
  sourceRef:
    kind: AppSource
    apiVersion: apps.splunk.com/v1alpha1
    spec:
      type: s3
      s3:
        endpoint: "https://s3.amazonaws.com"
        bucket: "my-bucket"
        basePath: "my-path"
      auth:
        secretRef:
          name: "my-secret"
      polling: 60
  package:
    path: apps/sample-app.tgz
  scope: local
