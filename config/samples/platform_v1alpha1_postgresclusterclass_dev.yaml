---
# Development PostgresClusterClass
# Minimal configuration for local development and testing
apiVersion: platform.splunk.com/v1alpha1
kind: PostgresClusterClass
metadata:
  name: postgresql-dev
spec:
  provisioner: postgresql.cnpg.io

  config:
    # Single instance - no HA (suitable for development)    
    instances: 1
    # Small storage for development
    storage: 10Gi

    # Latest PostgreSQL 18
    postgresVersion: "18"

    # Minimal resources
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    connectionPooler:
      enabled: true
      readOnly: false
    monitoring:
      postgresqlMetrics:
        enabled: true
      connectionPoolerMetrics:
        enabled: true

  cnpg:
    # Restart method - tolerate downtime in dev, can be changed to switchover, if required. Note that switchover method requires at least 3 instances to avoid downtime, so the default is restart for this class.
    primaryUpdateMethod: restart
    connectionPooler:
      instances: 2
      mode: transaction
      config:
        max_client_conn: "100"
