# Sample PostgresDatabase for application databases on a PostgresCluster.
# For each database entry, the operator manages two PostgreSQL login roles:
# <database>_admin and <database>_rw by default. Set adminRoleName and/or
# rwRoleName per entry when a consumer requires different PostgreSQL role names.
# Role intent is published on PostgresDatabase.status.databases[].roles and
# reconciled by the referenced PostgresCluster.
apiVersion: platform.splunk.com/v1alpha1
kind: PostgresDatabase
metadata:
  name: splunk-databases
  # namespace: default
spec:
  clusterRef:
    name: postgresql-cluster-dev
  databases:
    - name: kvstore
      # PostgreSQL creation options are immutable after this entry is admitted.
      # template: template0
      # encoding: UTF8
      # locale: en_US.UTF-8
      # localeProvider: icu
      # icuLocale: en-US
      # Runtime options remain mutable. A new database requesting false remains
      # connectable only until the operator finishes its initial privilege grant.
      # allowConnections: false
      connectionLimit: -1
      extensions:
        - pg_stat_statements
        - pgcrypto
      deletionPolicy: Delete
      # Optional: use externally managed Secrets instead of operator-generated
      # role Secrets. The Secret data must include username and password keys.
      # passwordConfig:
      #   externalAdminSecretRef:
      #     name: kvstore-admin-credentials
      #   externalRWSecretRef:
      #     name: kvstore-rw-credentials
    - name: analytics
      extensions:
        - pg_trgm
      deletionPolicy: Delete
