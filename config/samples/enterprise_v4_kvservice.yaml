apiVersion: enterprise.splunk.com/v4
kind: KVService
metadata:
  labels:
    app.kubernetes.io/name: splunk-operator
    app.kubernetes.io/managed-by: kustomize
  name: kvservice-sample
spec:
  scheme: http
  replicas: 2
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetAverageUtilizationCPU: 60
    targetAverageUtilizationMemory: 60
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 16Gi
  postgres:
    clusterRef:
      # The PostgreSQL controller provisions a database for each discovered tenant.
      name: postgresql-cluster-dev
