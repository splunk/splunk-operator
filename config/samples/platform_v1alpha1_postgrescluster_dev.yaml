# Sample PostgresCluster using Postgres-dev ClusterClass with overriding defaults
# This sample demonstrates how to override default values from the ClusterClass "postgresql-dev" (see platform_v1alpha1_postgresclusterclass_dev.yaml) in a PostgresCluster manifest.
# Overrides include changing storage, changing PostgreSQL version, and modifying resources.
apiVersion: platform.splunk.com/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: splunk-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgresql-cluster-dev
spec:
  # Reference the ClusterClass to inherit defaults - this is required, immutable, and must match the name of an existing ClusterClass
  class: postgresql-dev
  # Create PostgresDatabase resources that reference this cluster for application databases and roles.
  clusterDeletionPolicy: Retain
  instances: 3
  # Storage and PostgreSQL version are overridden from the ClusterClass defaults. Validation rules on the PostgresCluster resource will prevent removing these fields or setting them to lower values than the original overrides.
  storage: 20Gi
  postgresVersion: "18.0"
  # To use a CNPG-compatible image from a private registry, set postgresImage and
  # reference any required pull secret in the same namespace.
  # postgresImage: registry.example.com/team/postgresql:18.0
  # imagePullSecrets:
  #   - name: registry-creds
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
