---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sharedappruntimes.enterprise.splunk.com
spec:
  group: enterprise.splunk.com
  names:
    kind: SharedAppRuntime
    listKind: SharedAppRuntimeList
    plural: sharedappruntimes
    shortNames:
    - sar
    singular: sharedappruntime
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v4
    schema:
      openAPIV3Schema:
        description: |-
          SharedAppRuntime is the Schema for the SharedAppRuntime component.
          One CR per namespace manages the pool of shared app pods, one Pod per (node, app).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              appPodImage:
                description: AppPodImage is the image used for shared app pods (dispatcher
                  + NsJail).
                type: string
              apps:
                description: |-
                  Apps is the list of Splunk app names to create shared pods for.
                  One Pod per (node, app) is created. Until the app-discovery sidecar (Task #3)
                  lands, this list is authoritative.
                items:
                  type: string
                type: array
              splunkImage:
                description: |-
                  SplunkImage is used by the per-app-pod init container to copy /opt/splunk/bin
                  and /opt/splunk/lib until Task #5 replaces this with per-instance bin/lib PVCs.
                type: string
            type: object
          status:
            properties:
              message:
                type: string
              phase:
                description: Phase is used to represent the current phase of a custom
                  resource
                enum:
                - Pending
                - Ready
                - Updating
                - ScalingUp
                - ScalingDown
                - Terminating
                - Error
                type: string
              reconciledPods:
                description: |-
                  ReconciledPods is the list of Pod names the controller currently owns,
                  in the form "appruntime-<nodeId>-<app>".
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
