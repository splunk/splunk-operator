  names:
    kind: NoahCluster
    listKind: NoahClusterList
    plural: noahclusters
    shortNames:
    - noah
    singular: noahcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Status of noah cluster
