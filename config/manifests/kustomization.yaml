# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
resources:
- bases/splunk-operator.clusterserviceversion.yaml
- ../default
- ../samples
- ../scorecard

# OLM-only changes to ../default; see docs/develop/WebhookDevelopment.md.
patches:
- target:
    group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: cross-version-field-protection
  patch: |-
    - op: replace
      path: /webhooks/0/failurePolicy
      value: Ignore
