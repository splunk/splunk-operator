apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# cert-manager issues the webhook serving certificate into the webhook-server-cert
# Secret and injects its CA into every ValidatingWebhookConfiguration in the build.
# List it after the components that add ValidatingWebhookConfigurations.
#
# To supply your own certificate instead, replace this component with
# ../ca-bundle; see "Option B" in docs/reference/ValidationWebhook.md.
resources:
  - ../../certmanager

patches:
  - target:
      group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: any
        annotations:
          cert-manager.io/inject-ca-from: $(CERTIFICATE_NAMESPACE)/$(CERTIFICATE_NAME)

vars:
- name: CERTIFICATE_NAMESPACE
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
  fieldref:
    fieldpath: metadata.namespace
- name: CERTIFICATE_NAME
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert

configurations:
  - kustomizeconfig.yaml
