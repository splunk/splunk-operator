# currently patch is set to change deployment environment variables
patches:
- target:
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: WATCH_NAMESPACE
        value: WATCH_NAMESPACE_VALUE
      - name: RELATED_IMAGE_SPLUNK_ENTERPRISE
        value: SPLUNK_ENTERPRISE_IMAGE
      - name: OPERATOR_NAME
        value: splunk-operator
      - name: SPLUNK_GENERAL_TERMS
        value: SPLUNK_GENERAL_TERMS_VALUE
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=ValidationWebhook=true
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: MANAGER_EXTRA_ARG_VALUE
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

components:
# The Service fronting the webhook port and the Deployment patch that mounts
# the serving certificate.
- ../webhook-server
# Denies writes through an older API version that would prune fields only the
# stored version has. Install it only while the CrossVersionFieldProtection
# gate is on; see docs/develop/WebhookDevelopment.md.
- ../components/cross-version-field-protection
# cert-manager issues the serving certificate and injects its CA into the
# ValidatingWebhookConfigurations. To supply your own certificate, replace it
# with ../components/ca-bundle; see "Option B" in docs/reference/ValidationWebhook.md.
- ../components/cert-manager
