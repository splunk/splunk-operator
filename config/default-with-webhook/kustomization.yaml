# Adds namespace to all resources.
# Cluster-scoped deployment WITH webhook enabled (opt-in)
# Requires cert-manager to be installed in the cluster
namespace: splunk-operator

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: splunk-operator-

# Labels to add to all resources and selectors.
commonLabels:
  name: splunk-operator

bases:
- ../crd
- ../rbac
- ../persistent-volume
- ../service
- ../manager
# [WEBHOOK] Enabled for opt-in webhook deployment
- ../webhook
# [CERTMANAGER] The webhook Service and SERVICE_* vars come from the ../webhook-server
# component, and the serving certificate, CA injection and CERTIFICATE_* vars from
# the ../components/cert-manager component, both below.
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml

patchesStrategicMerge:
# Mount the controller config file for loading manager configurations
# through a ComponentConfig type
#- manager_config_patch.yaml

# [WEBHOOK] Enabled for webhook deployment
- manager_webhook_patch.yaml
- webhook_labels_patch.yaml

# SERVICE_NAMESPACE and SERVICE_NAME are declared by the ../webhook-server
# component, and CERTIFICATE_NAMESPACE and CERTIFICATE_NAME by the
# ../components/cert-manager component; redeclaring them here is a kustomize error.

