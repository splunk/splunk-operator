apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# This component is the single owner of the webhook Service and the Deployment's
# mount of the webhook-server-cert Secret. Overlays include it and must not
# declare the SERVICE_* vars themselves. The certificate in that Secret comes
# from the ../components/cert-manager component, or, with ../components/ca-bundle
# in its place, from a Secret you create.
resources:
  - service.yaml

patches:
  - path: manager_webhook_server_patch.yaml

vars:
- name: SERVICE_NAMESPACE
  objref:
    kind: Service
    version: v1
    name: webhook-service
  fieldref:
    fieldpath: metadata.namespace
- name: SERVICE_NAME
  objref:
    kind: Service
    version: v1
    name: webhook-service
