{{- if and .Values.sharedPostgres.enabled (include "splunk-operator.sharedPostgresObjectStore" .) (not .Values.sharedPostgres.backup.credentials.existingSecret) -}}
{{- $name := printf "%s-backup" (include "splunk-operator.sharedPostgresName" .) -}}
{{- $cfg := .Values.sharedPostgres.backup.credentials -}}
{{- $secret := lookup "v1" "Secret" (include "splunk-operator.namespace" .) $name -}}
{{- include "splunk-operator.sharedPostgresOwner" (dict "ctx" . "object" $secret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "splunk-operator.namespace" . }}
  labels:
    {{- include "splunk-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $cfg.accessKeyIdKey }}: {{ if $cfg.accessKeyId }}{{ $cfg.accessKeyId | b64enc | quote }}{{ else if $secret }}{{ required "retained backup Secret is missing its access key" (index $secret.data $cfg.accessKeyIdKey) | quote }}{{ else }}{{ fail "backup credentials.accessKeyId is required" }}{{ end }}
  {{ $cfg.secretAccessKeyKey }}: {{ if $cfg.secretAccessKey }}{{ $cfg.secretAccessKey | b64enc | quote }}{{ else if $secret }}{{ required "retained backup Secret is missing its secret key" (index $secret.data $cfg.secretAccessKeyKey) | quote }}{{ else }}{{ fail "backup credentials.secretAccessKey is required" }}{{ end }}
{{- end }}
