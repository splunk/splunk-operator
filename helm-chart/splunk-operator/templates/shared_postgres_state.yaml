{{/* Keep opt-in state in the release namespace, independent of namespaceOverride. */}}
{{- if .Values.sharedPostgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-shared-postgres
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    platform.splunk.com/shared-postgres-namespace: {{ include "splunk-operator.namespace" . | quote }}
    platform.splunk.com/shared-postgres-name: {{ include "splunk-operator.sharedPostgresName" . | quote }}
  labels:
    {{- include "splunk-operator.labels" . | nindent 4 }}
type: Opaque
{{- end }}
