{{- if include "splunk-operator.featureGateEnabled" (dict "ctx" . "gate" "KVService" "stage" "Alpha" "default" false) }}
# permissions for end users to view kvservices.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.splunkOperator.clusterWideAccess }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ include "splunk-operator.operator.fullname" . }}-kvservice-viewer-role
rules:
- apiGroups:
  - enterprise.splunk.com
  resources:
  - kvservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - enterprise.splunk.com
  resources:
  - kvservices/status
  verbs:
  - get
{{- end }}
