{{- if .Values.splunkOperator.clusterWideAccess }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "splunk-operator.operator.fullname" . }}-metrics-reader
rules:
- apiGroups:
  - metrics.splunk.com
  resources:
  - operatormetrics
  verbs:
  - get
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "splunk-operator.operator.fullname" . }}-metrics-reader
  namespace: {{ include "splunk-operator.namespace" . }}
rules:
- apiGroups:
  - metrics.splunk.com
  resources:
  - operatormetrics
  verbs:
  - get
{{- end }}
