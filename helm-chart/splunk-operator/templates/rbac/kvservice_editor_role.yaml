{{- if include "splunk-operator.featureGateEnabled" (dict "ctx" . "gate" "KVService" "stage" "Alpha" "default" false) }}
# permissions for end users to edit kvservices.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.splunkOperator.clusterWideAccess }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  labels:
{{ include "splunk-operator.labels" . | indent 4 }}
  name: {{ include "splunk-operator.fullname" . }}-kvservice-editor-role
{{- if not .Values.splunkOperator.clusterWideAccess }}
  namespace: {{ .Release.Namespace }}
{{- end }}
rules:
- apiGroups:
  - enterprise.splunk.com
  resources:
  - kvservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - enterprise.splunk.com
  resources:
  - kvservices/status
  verbs:
  - get
{{- end }}
