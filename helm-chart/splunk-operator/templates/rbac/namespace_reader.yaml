{{- if not .Values.splunkOperator.clusterWideAccess }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "splunk-operator.operator.fullname" . }}-namespace-reader.{{ include "splunk-operator.namespace" . }}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "splunk-operator.operator.fullname" . }}-namespace-reader.{{ include "splunk-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "splunk-operator.operator.fullname" . }}-namespace-reader.{{ include "splunk-operator.namespace" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "splunk-operator.operator.fullname" . }}-controller-manager
  namespace: {{ include "splunk-operator.namespace" . }}
{{- end }}
