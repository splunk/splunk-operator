{{/*
Both configurations use failurePolicy Fail, so each is rendered only while the
feature gate that serves it is on. Otherwise every matching write would fail.
*/}}
{{- if include "splunk-operator.crossVersionFieldProtectionEnabled" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "splunk-operator.webhookConfigurationName" (dict "ctx" . "suffix" "cross-version-field-protection") }}
  labels:
{{- include "splunk-operator.labels" . | nindent 4 }}
{{- if .Values.splunkOperator.webhook.useCertManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "splunk-operator.namespace" . }}/{{ include "splunk-operator.operator.fullname" . }}-serving-cert
{{- end }}
webhooks:
- name: cross-version-field-protection.enterprise.splunk.com
  admissionReviewVersions:
  - v1
  clientConfig:
{{- if not .Values.splunkOperator.webhook.useCertManager }}
    caBundle: {{ include "splunk-operator.webhookCABundle" . }}
{{- end }}
    service:
      name: {{ include "splunk-operator.operator.fullname" . }}-webhook-service
      namespace: {{ include "splunk-operator.namespace" . }}
      path: /validate
  # Exact keeps writes at the stored version out: only requests made at the
  # versions listed in rules are sent here.
  matchPolicy: Exact
  failurePolicy: Fail
  sideEffects: None
  timeoutSeconds: 5
{{- with include "splunk-operator.webhookNamespaceSelector" . }}
{{- . | trim | nindent 2 }}
{{- end }}
  rules:
  - apiGroups:
    - enterprise.splunk.com
    apiVersions:
    - v3
    operations:
    - UPDATE
    - DELETE
    resources:
    - standalones
    - standalones/*
    - indexerclusters
    - indexerclusters/*
    - searchheadclusters
    - searchheadclusters/*
    scope: Namespaced
{{- end }}
{{- if include "splunk-operator.validationWebhookEnabled" . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "splunk-operator.webhookConfigurationName" (dict "ctx" . "suffix" "validating-webhook-configuration") }}
  labels:
{{- include "splunk-operator.labels" . | nindent 4 }}
{{- if .Values.splunkOperator.webhook.useCertManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "splunk-operator.namespace" . }}/{{ include "splunk-operator.operator.fullname" . }}-serving-cert
{{- end }}
webhooks:
- name: vsplunk.enterprise.splunk.com
  admissionReviewVersions:
  - v1
  clientConfig:
{{- if not .Values.splunkOperator.webhook.useCertManager }}
    caBundle: {{ include "splunk-operator.webhookCABundle" . }}
{{- end }}
    service:
      name: {{ include "splunk-operator.operator.fullname" . }}-webhook-service
      namespace: {{ include "splunk-operator.namespace" . }}
      path: /validate
  failurePolicy: Fail
  sideEffects: None
{{- with include "splunk-operator.webhookNamespaceSelector" . }}
{{- . | trim | nindent 2 }}
{{- end }}
  rules:
  - apiGroups:
    - enterprise.splunk.com
    apiVersions:
    - v4
    operations:
    - CREATE
    - UPDATE
    resources:
    - standalones
    - indexerclusters
    - searchheadclusters
    - clustermanagers
    - licensemanagers
    - monitoringconsoles
  - apiGroups:
    - platform.splunk.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - postgresclusters
    - postgresclusterclasses
    - postgresdatabases
  - apiGroups:
    - platform.splunk.com
    apiVersions:
    - v1alpha1
    operations:
    - DELETE
    resources:
    - postgresdatabases
{{- end }}
