splunk-operator:
  enabled: true

# Splunk image
image:
  repository: docker.io/splunk/splunk:10.0.0

# cert-manager (https://cert-manager.io/) is required unless
# splunkOperator.webhook.useCertManager is false: it issues the operator's webhook
# serving certificate, and the CertManagement feature gate uses it to generate TLS
# certificates for Splunk components. Installing this subchart is disabled by default:
# enable it only if the target cluster does not already have cert-manager installed. See https://artifacthub.io/packages/helm/cert-manager/cert-manager
# for the full set of configurable values.
cert-manager:
  enabled: false
  crds:
    enabled: true

# Splunk Operator configurations
splunkOperator:

  # Splunk operator image and pull policy
  # reference: https://github.com/splunk/splunk-operator
  image:
    repository: docker.io/splunk/splunk-operator:3.1.0
    pullPolicy: IfNotPresent

  # Set image pull secrets to pull image from a private registry
  imagePullSecrets: []

  # Give operator cluster-wide access, otherwise access is limited to operator namespace
  clusterWideAccess: true

  # List namespaces to be watched by Splunk Operator e.x "namespace1,namespace2", must have cluster-wide access
  # Default watches the entire cluster
  watchNamespaces: ""

  # Add labels to Splunk Operator deployment
  labels: {}

  # Add annotations to Splunk Operator deployment
  annotations: {}

  # Add pod annotations to Splunk Operator deployment pod
  podAnnotations: {}

  # Add pod labels to Splunk Operator deployment pod
  podLabels: {}

  # Set security context for manager container, default ensures that no child process of manager can gain more privileges than manager
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#privilege-escalation
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - "ALL"
      add:
        - "NET_BIND_SERVICE"
    seccompProfile:
      type: "RuntimeDefault"

  # Set security context for Splunk Operator pod
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#podsecuritycontext-v1-core
  securityContext:
    runAsUser: 1001
    fsGroup: 1001
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"

  # Set usage of host networking and namespace
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#host-namespaces
  hostNetwork: false
  hostPID: false
  hostIPC: false

  # Define liveness probe to check if manager container is running
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  # Define readiness probe to check if manager container is ready for requests
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Webhook configuration. The webhook Service forwards port 443 to the operator's
  # port 9443, which serves the certificate in certSecretName.
  webhook:
    # true: cert-manager (required in the cluster) issues the serving certificate
    # and injects its CA into the ValidatingWebhookConfigurations.
    # false: you create the certSecretName Secret and set caBundle; see "Option B"
    # in the operator's docs/reference/ValidationWebhook.md.
    useCertManager: true
    # PEM CA (or several concatenated, e.g. while rotating) that signed the serving
    # certificate. Required when useCertManager is false, ignored otherwise.
    # Pass the file as is: --set-file splunkOperator.webhook.caBundle=ca.crt
    caBundle: ""
    # Secret holding the serving certificate (tls.crt, tls.key), mounted by the
    # operator. Change only if it collides with an existing secret.
    certSecretName: webhook-server-cert

  # Define splunk operator manager service ports
  # reference: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
  service:
    type: ClusterIP
    ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  # - name: metric
  #   port: 8080
  #   protocol: TCP
  #   targetPort: 8080

  # Set resource requests and limits for manager container
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 1000m
      memory: 2000Mi

  # Specify nodes that can schedule the Splunk Operator pod
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # Specify Splunk Operator pod tolerations
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # Define affinity scheduling rules
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#affinity-v1-core
  affinity: {}

  # Set duration in seconds the pod needs to terminate gracefully
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#pod-v1-core
  terminationGracePeriodSeconds: 10

  # Set storageClassName for the PersistentVolumeClaim
  persistentVolumeClaim:
    storageClassName: ""

  # Specify volumes for Splunk Operator pod, append additional volumes to list
  # reference: https://kubernetes.io/docs/concepts/storage/volumes/
  volumes:
  - name: app-staging
    persistentVolumeClaim:
      claimName: splunk-operator-app-download
# - name:
#   persistentVolumeClaim:
#     claimName:

  # Specify volume mounts for the manager container, append additional volume mounts to list
  # reference: https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/
  volumeMounts:
  - mountPath: /opt/splunk/appframework/
    name: app-staging
# - mountPath:
#   name:

  # Mandatory acknowledgment mechanism for the Splunk General Terms (SGT) 
  splunkGeneralTerms: ""

  # Feature gates to enable or disable on the operator.
  # Each key is a gate name and the value is a boolean (true/false).
  # The map is formatted into a single --feature-gates arg automatically.
  # Adding a new gate requires no chart changes — just add an entry here.
  # reference: https://splunk.github.io/splunk-operator/FeatureGates
  #
  # Two gates also decide which ValidatingWebhookConfigurations the chart renders:
  # - CrossVersionFieldProtection (on unless set to false) denies writes through an
  #   older served API version that would drop fields only the stored version can
  #   represent. Setting it to false also removes its webhook configuration, so
  #   writes through older versions keep working.
  # - ValidationWebhook (off unless set to true) validates writes to the operator's
  #   custom resources.
  # Gates set through a FEATURE_GATES or ENABLE_VALIDATION_WEBHOOK entry in
  # extraEnvs count too, with featureGates taking precedence as in the operator,
  # and so do AllAlpha and AllBeta (e.g. AllBeta: false turns
  # CrossVersionFieldProtection off unless it is set by name).
  featureGates: {}
  # featureGates:
  #   ValidationWebhook: true
  #   CrossVersionFieldProtection: false
  #   MyNewFeature: false

  telemetry:
    test: true

# Array with extra yaml to deploy with the chart. Evaluated as a template
extraManifests: []
# extraManifests:
#  - apiVersion: cloud.google.com/v1beta1
#    kind: BackendConfig
#    metadata:
#      name: "{{ .Release.Name }}-test"
#    spec:
#      securityPolicy:
#        name: "gcp-cloud-armor-policy-test"

# Additional envs to the splunk-operator container
extraEnvs: []
