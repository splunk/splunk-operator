splunk-operator:
  enabled: true

# Splunk image
image:
  repository: docker.io/splunk/splunk:10.4.0

# cert-manager (https://cert-manager.io/) is required unless
# splunkOperator.webhook.useCertManager is false: it issues the operator's webhook
# serving certificate, and the CertManagement feature gate uses it to generate TLS
# certificates for Splunk components. Installing this subchart is disabled by default:
# enable it only if the target cluster does not already have cert-manager installed. See https://artifacthub.io/packages/helm/cert-manager/cert-manager
# for the full set of configurable values.
cert-manager:
  enabled: false
  crds:
    enabled: true

# Optional bundled PostgreSQL controllers. Enable only when not already installed.
cloudnative-pg:
  enabled: false
  image:
    repository: registry-1.docker.io/splunk/postgresok-cnpg

plugin-barman-cloud:
  enabled: false
  image:
    registry: registry-1.docker.io
    repository: splunk/postgresok-plugin-barman-cloud
  sidecarImage:
    registry: registry-1.docker.io
    repository: splunk/postgresok-plugin-barman-cloud-sidecar

# Splunk Operator configurations
splunkOperator:

  # Splunk operator image and pull policy
  # reference: https://github.com/splunk/splunk-operator
  image:
    repository: docker.io/splunk/splunk-operator:3.2.0
    pullPolicy: IfNotPresent

  # Set image pull secrets to pull image from a private registry
  imagePullSecrets: []

  # Give operator cluster-wide access, otherwise access is limited to operator namespace
  clusterWideAccess: true

  # List namespaces to be watched by Splunk Operator e.x "namespace1,namespace2", must have cluster-wide access
  # Default watches the entire cluster
  watchNamespaces: ""

  # Add labels to Splunk Operator deployment
  labels: {}

  # Add annotations to Splunk Operator deployment
  annotations: {}

  # Add pod annotations to Splunk Operator deployment pod
  podAnnotations: {}

  # Add pod labels to Splunk Operator deployment pod
  podLabels: {}

  # Set security context for manager container, default ensures that no child process of manager can gain more privileges than manager
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#privilege-escalation
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - "ALL"
      add:
        - "NET_BIND_SERVICE"
    seccompProfile:
      type: "RuntimeDefault"

  # Set security context for Splunk Operator pod
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#podsecuritycontext-v1-core
  securityContext:
    runAsUser: 1001
    fsGroup: 1001
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"

  # Set usage of host networking and namespace
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#host-namespaces
  hostNetwork: false
  hostPID: false
  hostIPC: false

  # Enable Go runtime profiling on a dedicated listener. The default loopback
  # address keeps pprof off the pod network; use kubectl port-forward to collect
  # profiles. A non-loopback address intentionally overrides this secure default
  # and requires external authentication and network access controls.
  pprof:
    enabled: false
    bindAddress: 127.0.0.1:6060

  # Define liveness probe to check if manager container is running
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  # Define readiness probe to check if manager container is ready for requests
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Webhook configuration. The webhook Service forwards port 443 to the operator's
  # port 9443, which serves the certificate in certSecretName.
  webhook:
    # true: cert-manager (required in the cluster) issues the serving certificate
    # and injects its CA into the ValidatingWebhookConfigurations.
    # false: you create the certSecretName Secret and set caBundle; see "Option B"
    # in the operator's docs/reference/ValidationWebhook.md.
    useCertManager: true
    # PEM CA (or several concatenated, e.g. while rotating) that signed the serving
    # certificate. Required when useCertManager is false, ignored otherwise.
    # Pass the file as is: --set-file splunkOperator.webhook.caBundle=ca.crt
    caBundle: ""
    # Secret holding the serving certificate (tls.crt, tls.key), mounted by the
    # operator. Change only if it collides with an existing secret.
    certSecretName: webhook-server-cert

  # Define splunk operator manager service ports
  # reference: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
  service:
    type: ClusterIP
    ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    # The manager always binds the metrics listener to :8080
    # (--metrics-bind-address is not configurable via values). If you
    # override "port" to publish the endpoint on a different number,
    # keep targetPort set to the numeric 8080 rather than the port name,
    # otherwise the Service will route to a port nothing is listening on.
    - name: http-metrics
      port: 8080
      protocol: TCP
      targetPort: http-metrics

  # Configure the authenticated controller-runtime metrics endpoint, served
  # on the port above. This is independent of splunkOperator.telemetry, which
  # controls product-usage telemetry from managed Splunk Enterprise
  # instances. The endpoint always requires an authenticated, authorized
  # bearer token; grant access to it by listing readers below rather than
  # disabling authentication.
  metrics:
    # In namespace mode, let this chart create cluster-scoped auth review
    # permissions. If false, an administrator must provision them separately.
    delegatedAuth:
      createClusterRBAC: false
    # Service accounts that may read /metrics in this operator namespace.
    # Grant central scrapers access in each installation they must read,
    # independently of clusterWideAccess and watchNamespaces.
    readerServiceAccounts: []
    # - name: <fill-in>
    #   namespace: <fill-in>

  # Set resource requests and limits for manager container
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 1000m
      memory: 2000Mi

  # Specify nodes that can schedule the Splunk Operator pod
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # Specify Splunk Operator pod tolerations
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # Define affinity scheduling rules
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#affinity-v1-core
  affinity: {}

  # Set duration in seconds the pod needs to terminate gracefully
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#pod-v1-core
  terminationGracePeriodSeconds: 10

  # Set storageClassName for the PersistentVolumeClaim
  persistentVolumeClaim:
    storageClassName: ""

  # Specify volumes for Splunk Operator pod, append additional volumes to list
  # reference: https://kubernetes.io/docs/concepts/storage/volumes/
  volumes:
  - name: app-staging
    persistentVolumeClaim:
      claimName: splunk-operator-app-download
# - name:
#   persistentVolumeClaim:
#     claimName:

  # Specify volume mounts for the manager container, append additional volume mounts to list
  # reference: https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/
  volumeMounts:
  - mountPath: /opt/splunk/appframework/
    name: app-staging
# - mountPath:
#   name:

  # Mandatory acknowledgment mechanism for the Splunk General Terms (SGT) 
  splunkGeneralTerms: ""

  # Feature gates to enable or disable on the operator.
  # Each key is a gate name and the value is a boolean (true/false).
  # The map is formatted into a single --feature-gates arg automatically.
  # Adding a new gate requires no chart changes — just add an entry here.
  # reference: https://splunk.github.io/splunk-operator/FeatureGates
  #
  # Two gates also decide which ValidatingWebhookConfigurations the chart renders:
  # - CrossVersionFieldProtection (on unless set to false) denies writes through an
  #   older served API version that would drop fields only the stored version can
  #   represent. Setting it to false also removes its webhook configuration, so
  #   writes through older versions keep working.
  # - ValidationWebhook (off unless set to true) validates writes to the operator's
  #   custom resources.
  # Gates set through a FEATURE_GATES or ENABLE_VALIDATION_WEBHOOK entry in
  # extraEnvs count too, with featureGates taking precedence as in the operator,
  # and so do AllAlpha and AllBeta (e.g. AllBeta: false turns
  # CrossVersionFieldProtection off unless it is set by name).
  # Shared workloads enable required gates only when unset. Explicit disables here,
  # in extraEnvs.FEATURE_GATES, or through AllAlpha reject conflicting shared workloads.
  featureGates: {}
  # featureGates:
  #   ValidationWebhook: true
  #   CrossVersionFieldProtection: false
  #   MyNewFeature: false

  telemetry:
    test: true

  # FIPS 140-3 mode for the operator's own cryptography (TLS, hashing, key
  # generation). The operator image always links the Go FIPS 140-3 validated
  # module, but enforcement is OFF by default because it restricts TLS to
  # FIPS-approved settings, which breaks some Splunk upgrade paths.
  # Set enabled: true (e.g. for FedRAMP/GovCloud) to run the operator with
  # GODEBUG=fips140=on. This only governs the operator process; it does not
  # configure FIPS inside the managed Splunk pods.
  fips:
    enabled: false

# Array with extra yaml to deploy with the chart. Evaluated as a template
extraManifests: []
# extraManifests:
#  - apiVersion: cloud.google.com/v1beta1
#    kind: BackendConfig
#    metadata:
#      name: "{{ .Release.Name }}-test"
#    spec:
#      securityPolicy:
#        name: "gcp-cloud-armor-policy-test"

# Additional envs to the splunk-operator container
extraEnvs: []
# extraEnvs
#  - name: POD_IP
#    valueFrom:
#      fieldRef:
#        fieldPath: status.podIP

# One shared PostgreSQL cluster owned by this Helm release. See docs/deploy/Helm.md#postgresql-backend-controllers.
sharedPostgres:
  enabled: false
  # Select 18 explicitly only when compatibility with future non-Kubernetes migrations is unnecessary.
  postgresVersion: "17"
  instances: 3
  storage: 100Gi
  # Empty selects the cluster's default StorageClass for new volumes.
  storageClass: ""
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {cpu: "4", memory: 16Gi}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeSelector: {}
    tolerations: []
  images:
    postgresql:
      "17": registry-1.docker.io/splunk/postgresok-postgresql:17.10-splunk.1-ci.a1b7ebc9e8ad@sha256:d5d86314dbe7a2d1c1db3a37af3b21c2362d98026252cfa3fdec4f829ef31124
      "18": registry-1.docker.io/splunk/postgresok-postgresql:18.1-splunk.1-ci.a1b7ebc9e8ad@sha256:c2c5451783e970f5e198007934d18065c8b362c2702ec80899e054f66dfebc9a
    pgbouncer: registry-1.docker.io/splunk/postgresok-pgbouncer:pgbouncer-1-26-0-splunk.1-ci.a1b7ebc9e8ad@sha256:7156f136f47e0cdee12d2b0a8ee117090454d5d323b0f7312ef2fc9176e19c51
    imagePullSecrets: []
  connectionPooler:
    enabled: true
    readWrite: true
    # Disable for single-instance PostgreSQL deployments.
    readOnly: true
    instances: 3
    mode: transaction
    config: {}
  monitoring:
    postgresqlMetrics: true
    connectionPoolerMetrics: true
  postgresqlConfig: {}
  pgHBA:
    - hostnossl all all 0.0.0.0/0 reject
    - hostnossl all all ::/0 reject
    - hostssl all all 0.0.0.0/0 scram-sha-256
    - hostssl all all ::/0 scram-sha-256
  backup:
    enabled: false
    # Required when backup.enabled=false. Setting this accepts the absence of backups.
    acknowledgeNoBackups: false
    schedule: "0 2 * * *"
    destinationPath: ""
    endpointURL: ""
    retentionPolicy: 30d
    target: prefer-standby
    wal: {compression: gzip}
    credentials:
      # Prefer an externally managed Secret. For a single Helm install, supply
      # accessKeyId and secretAccessKey through a protected values file instead.
      existingSecret: ""
      accessKeyIdKey: accessKeyId
      secretAccessKeyKey: secretAccessKey
      accessKeyId: ""
      secretAccessKey: ""
  # Existing immutable recovery source API; use a separate release to restore to a replacement cluster.
  bootstrapFrom: {}
  # Additional application DatabaseDefinition entries (maximum 10).
  # Each entry defaults to deletionPolicy: Retain.
  databases: []

# Optional KVService in the operator namespace, using the release's PostgreSQL backend
# or an explicitly configured existing cluster. Enable each dependency as needed.
sharedKVService:
  enabled: false
  name: kvservice
  # Supply the qualified KVService release image (tag or digest); no latest fallback.
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  # Used only when sharedPostgres.enabled=false. Must be in the operator namespace.
  postgres:
    clusterRef:
      name: ""
  # Existing KVService CR fields; protocol follows the installed API/controller.
  certs: []
  autoscaling: {}
  readiness:
    # Total budget for PostgreSQL and KVService, not a separate budget per stage.
    timeoutSeconds: 900
    # Override for your Kubernetes version or an air-gapped mirror.
    image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
    imagePullSecrets: []
    # Override numeric IDs for namespace-specific policies such as OpenShift SCCs.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
