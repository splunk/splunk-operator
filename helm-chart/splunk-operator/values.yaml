splunk-operator:
  enabled: true

# Override the namespace for every namespaced chart resource.
# In namespace-scoped mode, the Operator watches this namespace. When empty,
# both placement and namespace-scoped watch behavior use the Helm release
# namespace.
namespaceOverride: ""

# Splunk image
image:
  repository: docker.io/splunk/splunk:10.0.0

# Splunk Operator configurations
splunkOperator:

  # Splunk operator image and pull policy
  # reference: https://github.com/splunk/splunk-operator
  image:
    repository: docker.io/splunk/splunk-operator:3.1.0
    pullPolicy: IfNotPresent

  # Set image pull secrets to pull image from a private registry
  imagePullSecrets: []

  # Give the Operator cluster-wide access. When false, access and watch scope
  # are limited to namespaceOverride, or to the Helm release namespace when no
  # override is set.
  clusterWideAccess: true

  # Comma-separated namespaces watched in cluster-wide mode, for example
  # "namespace1,namespace2". An empty value watches the entire cluster. This
  # value is ignored when clusterWideAccess is false.
  watchNamespaces: ""

  # Add labels to Splunk Operator deployment
  labels: {}

  # Add annotations to Splunk Operator deployment
  annotations: {}

  # Add pod annotations to Splunk Operator deployment pod
  podAnnotations: {}

  # Add pod labels to Splunk Operator deployment pod
  podLabels: {}

  # Set security context for manager container, default ensures that no child process of manager can gain more privileges than manager
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#privilege-escalation
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - "ALL"
      add:
        - "NET_BIND_SERVICE"
    seccompProfile:
      type: "RuntimeDefault"

  # Set security context for Splunk Operator pod
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#podsecuritycontext-v1-core
  securityContext:
    runAsUser: 1001
    fsGroup: 1001
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"

  # Set usage of host networking and namespace
  # reference: https://kubernetes.io/docs/concepts/security/pod-security-policy/#host-namespaces
  hostNetwork: false
  hostPID: false
  hostIPC: false

  # Define process liveness. This endpoint intentionally excludes Kubernetes
  # API, cache, leader-election, and managed Splunk health.
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  # Define reconciliation participation readiness. This endpoint waits for
  # cache synchronization and required leader-election Lease access; a healthy
  # non-leading contender is Ready.
  # reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Define splunk operator manager service ports
  # reference: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
  service:
    type: ClusterIP
    ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  # - name: metric
  #   port: 8080
  #   protocol: TCP
  #   targetPort: 8080

  # Set resource requests and limits for manager container
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 1000m
      memory: 2000Mi

  # Specify nodes that can schedule the Splunk Operator pod
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # Specify Splunk Operator pod tolerations
  # reference: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # Define affinity scheduling rules
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#affinity-v1-core
  affinity: {}

  # Set duration in seconds the pod needs to terminate gracefully
  # reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#pod-v1-core
  terminationGracePeriodSeconds: 10

  # Set storageClassName for the PersistentVolumeClaim
  persistentVolumeClaim:
    storageClassName: ""

  # Specify volumes for Splunk Operator pod, append additional volumes to list
  # reference: https://kubernetes.io/docs/concepts/storage/volumes/
  volumes:
  - name: app-staging
    persistentVolumeClaim:
      claimName: splunk-operator-app-download
# - name:
#   persistentVolumeClaim:
#     claimName:

  # Specify volume mounts for the manager container, append additional volume mounts to list
  # reference: https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/
  volumeMounts:
  - mountPath: /opt/splunk/appframework/
    name: app-staging
# - mountPath:
#   name:

  # Mandatory acknowledgment mechanism for the Splunk General Terms (SGT) 
  splunkGeneralTerms: ""

  # Feature gates to enable or disable on the operator.
  # Each key is a gate name and the value is a boolean (true/false).
  # The map is formatted into a single --feature-gates arg automatically.
  # Adding a new gate requires no chart changes — just add an entry here.
  # reference: https://splunk.github.io/splunk-operator/FeatureGates
  featureGates: {}
  # featureGates:
  #   ValidationWebhook: true
  #   MyNewFeature: false

  telemetry:
    test: true

# Array with extra yaml to deploy with the chart. Evaluated as a template
extraManifests: []
# extraManifests:
