suite: metrics authentication ClusterRole placement
templates:
  - templates/rbac/auth_proxy_role.yaml
tests:
  - it: should create cluster-scoped authentication review access for a namespace-scoped operator
    release:
      namespace: release-namespace
    set:
      namespaceOverride: watched-namespace
      splunkOperator.clusterWideAccess: false
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: splunk-operator-proxy-role-7c7a408c

  - it: should preserve the existing cluster-wide proxy role name
    set:
      splunkOperator.clusterWideAccess: true
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: splunk-operator-proxy-role
