suite: shared PostgreSQL backup credential retention
templates: [templates/shared_postgres_backup_secret.yaml]
release: {name: backend, namespace: backend}
set:
  sharedPostgres.enabled: true
  sharedPostgres.backup.enabled: true
  sharedPostgres.backup.destinationPath: s3://customer/backups/
  splunkOperator.featureGates.PostgresController: true
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr: {version: v1, resource: secrets}
      namespaced: true
tests:
  - it: renders customer supplied credentials as a retained Secret
    set:
      sharedPostgres.backup.credentials.accessKeyId: test-access
      sharedPostgres.backup.credentials.secretAccessKey: test-secret
    asserts:
      - isKind: {of: Secret}
      - equal: {path: data.accessKeyId, value: dGVzdC1hY2Nlc3M=}
      - equal: {path: data.secretAccessKey, value: dGVzdC1zZWNyZXQ=}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
  - it: reuses retained credential bytes when reinstall values omit them
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: backend-pg-aefaf86bf0-backup
            namespace: backend
            annotations:
              meta.helm.sh/release-name: backend
              meta.helm.sh/release-namespace: backend
          data: {accessKeyId: dGVzdC1hY2Nlc3M=, secretAccessKey: dGVzdC1zZWNyZXQ=}
    asserts:
      - equal: {path: data.accessKeyId, value: dGVzdC1hY2Nlc3M=}
      - equal: {path: data.secretAccessKey, value: dGVzdC1zZWNyZXQ=}
  - it: does not create an externally managed Secret
    set:
      sharedPostgres.backup.credentials.existingSecret: customer-owned
    asserts:
      - hasDocuments: {count: 0}
  - it: refuses to take over a foreign retained Secret
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: backend-pg-aefaf86bf0-backup
            namespace: backend
            annotations:
              meta.helm.sh/release-name: foreign
              meta.helm.sh/release-namespace: backend
          data: {accessKeyId: dGVzdC1hY2Nlc3M=, secretAccessKey: dGVzdC1zZWNyZXQ=}
    asserts:
      - failedTemplate:
          errorMessage: shared PostgreSQL resource backend-pg-aefaf86bf0-backup belongs to another release; use its original release name and namespace
