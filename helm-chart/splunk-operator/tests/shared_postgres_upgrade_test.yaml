suite: shared PostgreSQL upgrade protection
templates: [templates/shared_postgres.yaml]
release: {name: backend, namespace: backend, upgrade: true}
set:
  sharedPostgres.enabled: true
  sharedPostgres.backup.acknowledgeNoBackups: true
  splunkOperator.featureGates.PostgresController: true
kubernetesProvider:
  scheme:
    platform.splunk.com/v1alpha1/PostgresCluster:
      gvr: {group: platform.splunk.com, version: v1alpha1, resource: postgresclusters}
      namespaced: true
    platform.splunk.com/v1alpha1/PostgresClusterClass:
      gvr: {group: platform.splunk.com, version: v1alpha1, resource: postgresclusterclasses}
      namespaced: false
tests:
  - it: creates a missing class before admitting the cluster with webhooks enabled
    set:
      splunkOperator.featureGates.ValidationWebhook: true
    documentIndex: 0
    asserts:
      - isKind: {of: List}
      - equal: {path: 'items[0].kind', value: PostgresClusterClass}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
      - equal: {path: 'items[0].metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: rejects a changed default major version against an existing cluster
    kubernetesProvider:
      objects:
        - apiVersion: platform.splunk.com/v1alpha1
          kind: PostgresCluster
          metadata:
            name: backend-pg-aefaf86bf0
            namespace: backend
            annotations:
              meta.helm.sh/release-name: backend
              meta.helm.sh/release-namespace: backend
          spec: {postgresVersion: "18"}
    asserts:
      - failedTemplate:
          errorMessage: shared PostgreSQL major-version changes require the documented explicit major-upgrade workflow; restore the existing sharedPostgres.postgresVersion value
  - it: rejects another release's existing cluster
    kubernetesProvider:
      objects:
        - apiVersion: platform.splunk.com/v1alpha1
          kind: PostgresCluster
          metadata:
            name: backend-pg-aefaf86bf0
            namespace: backend
            annotations:
              meta.helm.sh/release-name: foreign
              meta.helm.sh/release-namespace: backend
          spec: {postgresVersion: "17"}
    asserts:
      - failedTemplate:
          errorMessage: shared PostgreSQL resource backend-pg-aefaf86bf0 belongs to another release; use its original release name and namespace
  - it: reinstalls the same major using its original ownership
    kubernetesProvider:
      objects:
        - apiVersion: platform.splunk.com/v1alpha1
          kind: PostgresCluster
          metadata:
            name: backend-pg-aefaf86bf0
            namespace: backend
            annotations:
              meta.helm.sh/release-name: backend
              meta.helm.sh/release-namespace: backend
          spec: {postgresVersion: "17"}
    asserts:
      - hasDocuments: {count: 2}
  - it: rejects changing an existing immutable class policy before applying resources
    set:
      sharedPostgres.storageClass: changed-storage
    kubernetesProvider:
      objects:
        - apiVersion: platform.splunk.com/v1alpha1
          kind: PostgresClusterClass
          metadata:
            name: backend-pg-aefaf86bf0
            annotations:
              meta.helm.sh/release-name: backend
              meta.helm.sh/release-namespace: backend
              platform.splunk.com/helm-class-policy: 5f517e5f53d6a680370471e07cac0b3951081c40e4e776dd682d7b74517f60b0
    asserts:
      - failedTemplate:
          errorMessage: "shared PostgreSQL class policy is immutable: keep storageClass, affinity, pooler policy and backup destination/Secret references unchanged, or restore into a replacement cluster"
  - it: updates operational values without replacing or modifying the retained class
    set:
      sharedPostgres.storage: 200Gi
      sharedPostgres.instances: 4
      sharedPostgres.resources.requests.cpu: "4"
    kubernetesProvider:
      objects:
        - apiVersion: platform.splunk.com/v1alpha1
          kind: PostgresClusterClass
          metadata:
            name: backend-pg-aefaf86bf0
            annotations:
              meta.helm.sh/release-name: backend
              meta.helm.sh/release-namespace: backend
              platform.splunk.com/helm-class-policy: 5f517e5f53d6a680370471e07cac0b3951081c40e4e776dd682d7b74517f60b0
    documentIndex: 1
    asserts:
      - equal: {path: spec.storage, value: 200Gi}
      - equal: {path: spec.instances, value: 4}
      - equal: {path: spec.resources.requests.cpu, value: "4"}
      - equal: {path: spec.class, value: backend-pg-aefaf86bf0}
      - notExists: {path: 'items[0].metadata.annotations["helm.sh/hook"]'}
        documentIndex: 0
