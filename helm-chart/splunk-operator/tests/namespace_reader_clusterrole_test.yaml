suite: namespace-scoped Namespace reader RBAC
templates:
  - templates/rbac/namespace_reader_clusterrole.yaml
tests:
  - it: should not render when cluster-wide access is enabled
    set:
      splunkOperator.clusterWideAccess: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should restrict Namespace get to the effective watched namespace
    release:
      namespace: release-namespace
    set:
      namespaceOverride: watched-namespace
      splunkOperator.clusterWideAccess: false
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: splunk-operator-namespace-reader-7c7a408c
      - equal:
          path: rules[0]
          value:
            apiGroups:
              - ""
            resources:
              - namespaces
            resourceNames:
              - watched-namespace
            verbs:
              - get
