suite: bundled PostgreSQL controllers
templates:
  - charts/cloudnative-pg/templates/*.yaml
  - charts/plugin-barman-cloud/templates/*.yaml
tests:
  - it: uses public CNPG for the controller and bootstrap when enabled
    template: charts/cloudnative-pg/templates/deployment.yaml
    set: &bundledBackends
      cloudnative-pg.enabled: true
      plugin-barman-cloud.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: &cnpgImage registry-1.docker.io/splunk/postgresok-cnpg:v1-30-1-splunk.3-ci.e3f9db841236@sha256:1748ab4c6f04cb9c2a2d2a573bafffe52063cd3e04da43e22b40160edb95d177
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_IMAGE_NAME
            value: *cnpgImage
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: cloudnative-pg
  - it: uses the public Barman controller when enabled
    template: charts/plugin-barman-cloud/templates/deployment.yaml
    set: *bundledBackends
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry-1.docker.io/splunk/postgresok-plugin-barman-cloud:v0-15-1-splunk.10-ci.e3f9db841236@sha256:645383fbfa30118538d616494cbf47049beb852f8dacf5e4af2698b1de317587
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: plugin-barman-cloud
  - it: uses the distinct public Barman sidecar when enabled
    template: charts/plugin-barman-cloud/templates/configmap.yaml
    set: *bundledBackends
    asserts:
      - equal:
          path: data.SIDECAR_IMAGE
          value: registry-1.docker.io/splunk/postgresok-plugin-barman-cloud-sidecar:v0-15-1-splunk.10-ci.e3f9db841236@sha256:82c49fcb005a8993fa3e04040bde1744607958b130a088af435b7564f4067602
  - it: passes CNPG mirror credentials and bootstrap reference together
    template: charts/cloudnative-pg/templates/deployment.yaml
    set:
      <<: *bundledBackends
      cloudnative-pg.image.repository: mirror.example.com/backend/cnpg
      cloudnative-pg.imagePullSecrets: [{name: cnpg-reader}]
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: [{name: cnpg-reader}]
      - equal:
          path: spec.template.spec.containers[0].image
          value: &cnpgMirrorImage mirror.example.com/backend/cnpg:v1-30-1-splunk.3-ci.e3f9db841236@sha256:1748ab4c6f04cb9c2a2d2a573bafffe52063cd3e04da43e22b40160edb95d177
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_IMAGE_NAME
            value: *cnpgMirrorImage
  - it: passes independent Barman controller mirror credentials
    template: charts/plugin-barman-cloud/templates/deployment.yaml
    set:
      <<: *bundledBackends
      plugin-barman-cloud.image.registry: mirror.example.com
      plugin-barman-cloud.image.repository: backend/barman
      plugin-barman-cloud.imagePullSecrets: [{name: barman-reader}]
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: [{name: barman-reader}]
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/backend/barman:v0-15-1-splunk.10-ci.e3f9db841236@sha256:645383fbfa30118538d616494cbf47049beb852f8dacf5e4af2698b1de317587
  - it: passes an independent Barman sidecar mirror
    template: charts/plugin-barman-cloud/templates/configmap.yaml
    set:
      <<: *bundledBackends
      plugin-barman-cloud.sidecarImage.registry: workloads.example.com
      plugin-barman-cloud.sidecarImage.repository: backend/sidecar
    asserts:
      - equal:
          path: data.SIDECAR_IMAGE
          value: workloads.example.com/backend/sidecar:v0-15-1-splunk.10-ci.e3f9db841236@sha256:82c49fcb005a8993fa3e04040bde1744607958b130a088af435b7564f4067602
  - it: omits both controllers and CRDs by default
    asserts:
      - hasDocuments:
          count: 0
  - it: enables CNPG independently
    template: charts/cloudnative-pg/templates/deployment.yaml
    set:
      cloudnative-pg.enabled: true
    asserts:
      - hasDocuments:
          count: 1
  - it: enables Barman independently
    template: charts/plugin-barman-cloud/templates/deployment.yaml
    set:
      plugin-barman-cloud.enabled: true
    asserts:
      - hasDocuments:
          count: 1
  - it: retains CNPG CRDs on uninstall
    template: charts/cloudnative-pg/templates/crds/crds.yaml
    set: *bundledBackends
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
  - it: retains Barman CRDs on uninstall
    template: charts/plugin-barman-cloud/templates/crds/crds.yaml
    set: *bundledBackends
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
