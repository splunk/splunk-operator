suite: webhook service and certificate
templates:
  - templates/webhook.yaml
release:
  namespace: splunk-operator
tests:
  - it: should expose the webhook server port on 443
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: splunk-operator-webhook-service
      - equal:
          path: spec.ports
          value:
            - name: webhook-server
              port: 443
              protocol: TCP
              targetPort: 9443

  - it: should issue the serving certificate for the webhook service
    documentSelector:
      path: kind
      value: Certificate
    asserts:
      - equal:
          path: metadata.name
          value: splunk-operator-serving-cert
      - equal:
          path: spec.dnsNames
          value:
            - splunk-operator-webhook-service.splunk-operator.svc
            - splunk-operator-webhook-service.splunk-operator.svc.cluster.local
      - equal:
          path: spec.secretName
          value: webhook-server-cert

  - it: should render only the Service when useCertManager is false
    set:
      splunkOperator.webhook.useCertManager: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: splunk-operator-webhook-service
