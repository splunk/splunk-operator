suite: operator ServiceAccount placement
templates:
  - templates/serviceaccount.yaml
tests:
  - it: should place the ServiceAccount in the effective namespace
    release:
      namespace: release-namespace
    set:
      namespaceOverride: watched-namespace
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.namespace
          value: watched-namespace
