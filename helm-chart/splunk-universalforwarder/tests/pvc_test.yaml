suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: should render no PVCs by default (stateless emptyDir mode)
    asserts:
      - hasDocuments:
          count: 0

  - it: should render two PVCs when storage.emptyDir is false
    set:
      storage.emptyDir: false
    asserts:
      - hasDocuments:
          count: 2

  - it: should create pvc-etc with default 1Gi size when emptyDir disabled
    set:
      storage.emptyDir: false
    documentIndex: 0
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-splunk-universalforwarder-etc
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: should create pvc-var with default 5Gi size when emptyDir disabled
    set:
      storage.emptyDir: false
    documentIndex: 1
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-splunk-universalforwarder-var
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: should use custom storage sizes when emptyDir disabled
    set:
      storage.emptyDir: false
      storage.etcSize: 2Gi
      storage.varSize: 20Gi
    documentIndex: 0
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi

  - it: should not set storageClassName when empty
    set:
      storage.emptyDir: false
    documentIndex: 0
    asserts:
      - isNull:
          path: spec.storageClassName

  - it: should set storageClassName when provided
    set:
      storage.emptyDir: false
      storage.storageClassName: gp3
    documentIndex: 0
    asserts:
      - equal:
          path: spec.storageClassName
          value: gp3
