suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: should create Secret when existingSecret is empty
    asserts:
      - isKind:
          of: Secret
      - hasDocuments:
          count: 1

  - it: should not create Secret when existingSecret is set
    set:
      splunkConfig.existingSecret: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should use passwordKey as Secret data key
    asserts:
      - isNotEmpty:
          path: data.password

  - it: should use custom passwordKey when overridden
    set:
      splunkConfig.passwordKey: splunk-password
    asserts:
      - isNotEmpty:
          path: data.splunk-password

  # Standalone pattern: default.yml in Secret with forward_servers
  - it: should include default.yml key in Secret
    asserts:
      - isNotEmpty:
          path: data["default.yml"]

  - it: should include kvstore disabled in default.yml
    asserts:
      - isNotEmpty:
          path: data["default.yml"]
