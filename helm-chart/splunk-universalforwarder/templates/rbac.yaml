{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-clusterrole
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
# D-21, RBAC-03: UF makes no K8s API calls; empty rules is minimum privilege
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-clusterrolebinding
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "splunk-universalforwarder.fullname" . }}-clusterrole
subjects:
  - kind: ServiceAccount
    name: {{ include "splunk-universalforwarder.serviceAccountName" . }}
    namespace: {{ include "splunk-universalforwarder.namespace" . }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-role
  namespace: {{ include "splunk-universalforwarder.namespace" . }}
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
# D-21, RBAC-03: UF makes no K8s API calls; empty rules is minimum privilege
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-rolebinding
  namespace: {{ include "splunk-universalforwarder.namespace" . }}
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "splunk-universalforwarder.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "splunk-universalforwarder.serviceAccountName" . }}
    namespace: {{ include "splunk-universalforwarder.namespace" . }}
{{- end }}
{{- end }}
