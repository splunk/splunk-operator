{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-pdb
  namespace: {{ include "splunk-universalforwarder.namespace" . }}
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "splunk-universalforwarder.selectorLabels" . | nindent 6 }}
{{- end }}
