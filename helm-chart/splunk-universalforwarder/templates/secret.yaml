{{- if not .Values.splunkConfig.existingSecret }}
{{- $fwdBlock := "" }}
{{- if .Values.splunkConfig.forwardServers }}
{{- $firstParts := index .Values.splunkConfig.forwardServers 0 | splitList ":" }}
{{- $firstHost := index $firstParts 0 }}
{{- $firstPort := index $firstParts 1 | default "9997" }}
{{- $lines := "" }}
{{- range .Values.splunkConfig.forwardServers }}
{{- $parts := . | splitList ":" }}
{{- $host := index $parts 0 }}
{{- $lines = printf "%s\n    - %s" $lines $host }}
{{- end }}
{{- $fwdBlock = printf "\n  forward_servers:%s\n  s2s_port: %s" $lines $firstPort }}
{{- else if .Values.splunkConfig.forwardServer }}
{{- $parts := .Values.splunkConfig.forwardServer | splitList ":" }}
{{- $host := index $parts 0 }}
{{- $port := index $parts 1 | default "9997" }}
{{- $fwdBlock = printf "\n  forward_servers:\n    - %s\n  s2s_port: %s" $host $port }}
{{- end }}
{{- $defaultYml := printf "splunk:\n  password: %s%s\n  kvstore:\n    disabled: 1\n" (.Values.splunkConfig.password | quote) $fwdBlock }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splunk-universalforwarder.fullname" . }}-secret
  namespace: {{ include "splunk-universalforwarder.namespace" . }}
  labels:
    {{- include "splunk-universalforwarder.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.splunkConfig.passwordKey }}: {{ .Values.splunkConfig.password | b64enc | quote }}
  default.yml: {{ $defaultYml | b64enc | quote }}
{{- end }}
