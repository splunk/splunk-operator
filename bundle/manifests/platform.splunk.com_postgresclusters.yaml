apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  labels:
    name: splunk-operator
  name: postgresclusters.platform.splunk.com
spec:
  group: platform.splunk.com
  names:
    kind: PostgresCluster
    listKind: PostgresClusterList
    plural: postgresclusters
    singular: postgrescluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.instances
      name: Instances
      type: integer
    - jsonPath: .status.readyInstances
      name: Ready
      type: integer
    - jsonPath: .status.currentPrimary
      name: Primary
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PostgresCluster is the Schema for the postgresclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              backup:
                description: |-
                  Backup overrides backup settings from ClusterClass.
                  Only generic fields (enabled, schedule) can be overridden.
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether automated backups are active.
                      When true, schedule is required and the class must define a provider backup implementation policy.
                      When unset on PostgresCluster, the class-level value is inherited.
                    type: boolean
                  schedule:
                    description: |-
                      Schedule is a standard 5-field cron expression for backup timing.
                      Required when enabled is true.
                      Example: "0 2 * * *" (daily at 2am)
                    pattern: ^(\S+\s+){4}\S+$
                    type: string
                type: object
              bootstrapFrom:
                description: |-
                  BootstrapFrom configures recovery-based bootstrapping from an existing backup.
                  When set, the cluster is initialized from the specified backup source instead of a fresh initdb.
                  This field is immutable after creation.
                properties:
                  objectStorage:
                    description: |-
                      ObjectStorage restores from an object storage backup (e.g. S3) managed by the
                      PostgresClusterClass. Bucket path and credentials are resolved from the class.
                      Mutually exclusive with volumeSnapshot.
                    properties:
                      serverName:
                        description: |-
                          ServerName is the identifier of the source cluster in the object store.
                          Must match the server name used when the backup was written.
                        minLength: 1
                        type: string
                    required:
                    - serverName
                    type: object
                  recoveryTarget:
                    description: |-
                      RecoveryTarget defines an optional point-in-time recovery (PITR) target.
                      When omitted, recovery replays all available WAL (recovery to latest).
                      For a volumeSnapshot source, setting recoveryTarget requires volumeSnapshot.walArchive
                      so WAL segments can be replayed past the snapshot point.
                    properties:
                      exclusive:
                        description: |-
                          Exclusive stops recovery just before the target rather than just after (default: false).
                          Ignored for type immediate.
                        type: boolean
                      type:
                        description: Type selects which kind of recovery target Value
                          carries.
                        enum:
                        - time
                        - lsn
                        - xid
                        - name
                        - immediate
                        type: string
                      value:
                        description: |-
                          Value is the target's value, interpreted according to Type:
                          an RFC 3339 timestamp (time), a WAL LSN (lsn), a transaction ID (xid), or a restore-point name
                          (name). It must be empty when Type is immediate.
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: value is required for target types time, lsn, xid,
                        and name, and must be empty for type immediate
                      rule: 'self.type == ''immediate'' ? !has(self.value) || size(self.value)
                        == 0 : has(self.value) && size(self.value) > 0'
                  volumeSnapshot:
                    description: |-
                      VolumeSnapshot restores from Kubernetes VolumeSnapshot resources.
                      Mutually exclusive with objectStorage.
                    properties:
                      storage:
                        description: Storage is the name of the VolumeSnapshot containing
                          the PGDATA directory.
                        minLength: 1
                        type: string
                      walArchive:
                        description: |-
                          WalArchive identifies the object store WAL archive to replay WAL segments after the
                          snapshot. Bucket path and credentials are resolved from the class backup config.
                          Required when RecoveryTarget is set (PITR); optional for a plain snapshot restore.
                        properties:
                          serverName:
                            description: |-
                              ServerName is the identifier of the source cluster in the object store.
                              Must match the server name used when the backup was written.
                            minLength: 1
                            type: string
                        required:
                        - serverName
                        type: object
                      walStorage:
                        description: |-
                          WalStorage is the name of the VolumeSnapshot containing the pg_wal directory.
                          Required only when the source cluster had a separate WAL volume.
                        minLength: 1
                        type: string
                    required:
                    - storage
                    type: object
                type: object
                x-kubernetes-validations:
                - message: bootstrapFrom is immutable
                  rule: self == oldSelf
                - message: exactly one of volumeSnapshot or objectStorage must be
                    set
                  rule: has(self.volumeSnapshot) != has(self.objectStorage)
              class:
                description: This field is IMMUTABLE after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: class is immutable
                  rule: self == oldSelf
              clusterDeletionPolicy:
                default: Retain
                description: ClusterDeletionPolicy controls the deletion behavior
                  of the underlying CNPG Cluster when the PostgresCluster is deleted.
                enum:
                - Delete
                - Retain
                type: string
              connectionPooler:
                description: |-
                  ConnectionPooler controls whether PgBouncer connection pooling is deployed for this cluster.
                  Sub-fields override the matching values from the class-level connectionPooler config.
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether the connection pooler is deployed at all.
                      When omitted the pooler is treated as disabled (see isPoolerEnabled).
                    type: boolean
                  readOnly:
                    description: |-
                      ReadOnly controls whether the RO pooler is reconciled when Enabled is true.
                      The RO pooler additionally requires the cluster to run with instances >= 2;
                      the admission webhook rejects readOnly=true with instances<2.
                      When omitted it is treated as true (see poolerReadOnlyWanted).
                    type: boolean
                  readWrite:
                    description: |-
                      ReadWrite controls whether the RW pooler is reconciled when Enabled is true.
                      When omitted it is treated as true (see poolerReadWriteWanted).
                    type: boolean
                type: object
              imagePullSecrets:
                description: |-
                  ImagePullSecrets references Secrets in the same namespace used by CNPG to
                  pull the PostgreSQL image. Cluster values override class defaults.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
                x-kubernetes-validations:
                - message: imagePullSecrets.name must not be empty
                  rule: self.all(x, has(x.name) && x.name.size() > 0)
              instances:
                description: Instances overrides the number of PostgreSQL instances
                  from ClusterClass.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              monitoring:
                description: Monitoring contains configuration for metrics exposure
                  features.
                properties:
                  connectionPoolerMetrics:
                    description: |-
                      ConnectionPoolerMetrics overrides whether connection pooler metrics scraping is enabled.
                      When unset, the class-level setting applies.
                    type: boolean
                  customQueriesConfigMap:
                    description: Ordered cluster-scoped sources; selector optional
                      fields are unsupported.
                    items:
                      description: Selects a key from a ConfigMap.
                      properties:
                        key:
                          description: |-
                            The key to select from the ConfigMap's Data field.
                            Keys in the BinaryData field are not currently propagated to container env vars.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: name must not be empty
                      rule: self.all(x, has(x.name) && x.name.size() > 0)
                    - message: key must not be empty
                      rule: self.all(x, x.key.size() > 0)
                  postgresqlMetrics:
                    description: |-
                      PostgreSQLMetrics overrides whether PostgreSQL metrics scraping is enabled.
                      When unset, the class-level setting applies.
                    type: boolean
                type: object
              passwordConfig:
                description: |-
                  External superuser secret configuration,
                  if non empty, external secret management is mandatory.
                properties:
                  superuserExternalSecretRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - superuserExternalSecretRef
                type: object
                x-kubernetes-validations:
                - message: superuserExternalSecretRef.name must not be empty
                  rule: self.superuserExternalSecretRef.name.size() > 0
              pgHBA:
                description: |-
                  PgHBA contains pg_hba.conf host-based authentication rules.
                  Defines client authentication and connection security (cluster-wide).
                  Example: ["hostssl all all 0.0.0.0/0 scram-sha-256"]
                items:
                  type: string
                type: array
              postgresImage:
                description: |-
                  PostgresImage overrides the CNPG PostgreSQL image. The image must include
                  a tag whose leading PostgreSQL major version matches the effective
                  postgresVersion. The "latest" tag and digest-only references are rejected;
                  tag-plus-digest references are supported.
                type: string
                x-kubernetes-validations:
                - message: postgresImage must be an image reference, not a URL
                  rule: '!self.contains(''://'')'
                - message: postgresImage must not contain whitespace
                  rule: '!self.matches(''.*[ \t\r\n].*'')'
                - message: postgresImage must include a tag; digest-only references
                    are not supported
                  rule: self.split('@')[0].split('/')[self.split('@')[0].split('/').size()
                    - 1].contains(':')
                - message: postgresImage must not use the latest tag
                  rule: self.split('@')[0].split(':')[self.split('@')[0].split(':').size()
                    - 1] != 'latest'
                - message: postgresImage tag is not a valid image tag
                  rule: self.split('@')[0].split(':')[self.split('@')[0].split(':').size()
                    - 1].matches('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
                - message: postgresImage digest is not a valid OCI digest
                  rule: self.split('@').size() <= 2 && (!self.contains('@') || self.split('@')[1].matches('^[A-Za-z][A-Za-z0-9]*(?:[+._-][A-Za-z][A-Za-z0-9]*)*:[0-9A-Fa-f]{32,}$'))
              postgresMajorUpgradeConfig:
                description: PostgresMajorUpgradeConfig sets up the upgrade flow according
                  to backup, version and strategy requirements.
                properties:
                  allow:
                    description: |-
                      Allow permits the operator to execute a PostgreSQL major-version
                      upgrade when spec.postgresVersion crosses a major-version boundary.
                    type: boolean
                  blueGreen:
                    description: |-
                      BlueGreen declares the gates for the blue/green major-upgrade strategy.
                      Omitting this object has the same effective values as its defaults: all
                      gates are false and switchoverTimeout is 60 seconds.
                    properties:
                      cancel:
                        default: false
                        description: Cancel requests pre-commit abandonment of the
                          active attempt.
                        type: boolean
                      cleanup:
                        default: false
                        description: |-
                          Cleanup authorizes deletion of the retained non-authoritative environment
                          after the attempt reaches a safe terminal boundary.
                        type: boolean
                      switchover:
                        default: false
                        description: |-
                          Switchover authorizes the production endpoint handoff after the candidate
                          is ready. Once consumed, a later false value does not reverse the attempt.
                        type: boolean
                      switchoverTimeout:
                        default: 60s
                        description: |-
                          SwitchoverTimeout bounds the operator-controlled endpoint handoff. The
                          workflow latches the effective value when switchover begins, so later spec
                          changes affect only a later attempt.
                        type: string
                        x-kubernetes-validations:
                        - message: switchoverTimeout must be between 30s and 3600s
                          rule: duration(self) >= duration('30s') && duration(self)
                            <= duration('3600s')
                    type: object
                  strategy:
                    default: pgUpgrade
                    description: |-
                      Strategy selects the major-upgrade implementation.
                      pgUpgrade is the existing in-place implementation. blueGreen prepares a
                      replacement environment only when it is explicitly selected.
                    enum:
                    - pgUpgrade
                    - blueGreen
                    type: string
                type: object
                x-kubernetes-validations:
                - message: blueGreen may be configured only when strategy is blueGreen
                  rule: self.strategy == 'blueGreen' || !has(self.blueGreen)
              postgresVersion:
                description: |-
                  PostgresVersion is the PostgreSQL version (major or major.minor).
                  Examples: "18" (latest 18.x), "18.1" (specific minor), "17", "16"
                pattern: ^[0-9]+(\.[0-9]+)?$
                type: string
              postgresqlConfig:
                additionalProperties:
                  type: string
                description: |-
                  PostgreSQLConfig overrides PostgreSQL engine parameters from ClusterClass.
                  Maps to postgresql.conf settings.
                  Example: {"shared_buffers": "128MB", "log_min_duration_statement": "500ms"}
                type: object
              resources:
                description: Resources overrides CPU/memory resources from ClusterClass.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              storage:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Storage overrides the storage size from ClusterClass.
                  Example: "5Gi"
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            required:
            - class
            type: object
            x-kubernetes-validations:
            - messageExpression: '!has(self.postgresVersion) ? ''postgresVersion cannot
                be removed once set (was: '' + oldSelf.postgresVersion + '')'' : ''postgresVersion
                major version cannot be downgraded (from: '' + oldSelf.postgresVersion
                + '', to: '' + self.postgresVersion + '')'''
              rule: '!has(oldSelf.postgresVersion) || (has(self.postgresVersion) &&
                int(self.postgresVersion.split(''.'')[0]) >= int(oldSelf.postgresVersion.split(''.'')[0]))'
            - messageExpression: '!has(self.storage) ? ''storage cannot be removed
                once set (was: '' + string(oldSelf.storage) + '')'' : ''storage size
                cannot be decreased (from: '' + string(oldSelf.storage) + '', to:
                '' + string(self.storage) + '')'''
              rule: '!has(oldSelf.storage) || (has(self.storage) && quantity(self.storage).compareTo(quantity(oldSelf.storage))
                >= 0)'
            - message: passwordConfig cannot be altered after creation
              rule: (has(self.passwordConfig) == has(oldSelf.passwordConfig))
            - message: passwordConfig is immutable once set
              rule: '!has(self.passwordConfig) || self.passwordConfig == oldSelf.passwordConfig'
          status:
            description: PostgresClusterStatus defines the observed state of PostgresCluster.
            properties:
              backupStatus:
                description: BackupStatus contains the observed state of backup configuration.
                properties:
                  objectStore:
                    description: ObjectStore contains status for barman object storage
                      backups.
                    properties:
                      enabled:
                        description: Enabled indicates whether object store backups
                          are active.
                        type: boolean
                      lastScheduleTime:
                        description: LastScheduleTime is when the last backup was
                          scheduled.
                        format: date-time
                        type: string
                      nextScheduleTime:
                        description: NextScheduleTime is the next scheduled backup
                          time.
                        format: date-time
                        type: string
                    type: object
                  volumeSnapshot:
                    description: VolumeSnapshot contains status for volume snapshot
                      backups.
                    properties:
                      enabled:
                        description: Enabled indicates whether volume snapshot backups
                          are active.
                        type: boolean
                      lastScheduleTime:
                        description: LastScheduleTime is when the last backup was
                          scheduled.
                        format: date-time
                        type: string
                      nextScheduleTime:
                        description: NextScheduleTime is the next scheduled backup
                          time.
                        format: date-time
                        type: string
                    type: object
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the PostgresCluster's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionPoolerStatus:
                description: |-
                  ConnectionPoolerStatus contains the observed state of the connection pooler.
                  Only populated when connection pooler is enabled in the PostgresClusterClass.
                properties:
                  enabled:
                    description: Enabled indicates whether pooler is active for this
                      cluster.
                    type: boolean
                  readOnlyEnabled:
                    description: |-
                      ReadOnlyEnabled is true when the RO pooler resource is reconciled by the operator.
                      Independent consumers should mirror this gate before advertising RO pooler endpoints.
                    type: boolean
                  readWriteEnabled:
                    description: ReadWriteEnabled is true when the RW pooler resource
                      is reconciled by the operator.
                    type: boolean
                type: object
              currentPgVersion:
                description: |-
                  CurrentPgVersion is the PostgreSQL major version currently running against
                  the data directory, as reported by CNPG (PGDataImageInfo.MajorVersion).
                  Written on every reconcile; used as the source-version baseline for the
                  major-version upgrade use case when no prior upgrade status entries exist.
                type: string
              currentPrimary:
                description: CurrentPrimary is the name of the pod currently hosting
                  the primary.
                type: string
              customMetricsStatus:
                description: Per-database decisions consumed by database readiness
                  gates.
                properties:
                  databaseContributions:
                    items:
                      properties:
                        appliedRevision:
                          type: string
                        databaseName:
                          minLength: 1
                          type: string
                        desiredRevision:
                          minLength: 1
                          type: string
                        message:
                          type: string
                        postgresDatabaseName:
                          minLength: 1
                          type: string
                        postgresDatabaseUID:
                          minLength: 1
                          type: string
                        reason:
                          minLength: 1
                          type: string
                        status:
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                      required:
                      - databaseName
                      - desiredRevision
                      - message
                      - postgresDatabaseName
                      - postgresDatabaseUID
                      - reason
                      - status
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - postgresDatabaseName
                    - postgresDatabaseUID
                    - databaseName
                    x-kubernetes-list-type: map
                type: object
              instances:
                description: |-
                  Instances is the declared instance count reported by the underlying
                  provisioner.
                format: int32
                type: integer
              lastTransitionTime:
                description: |-
                  LastTransitionTime is the start time of the active time-to-Ready cycle.
                  It is cleared when the PostgresCluster successfully reaches Ready.
                format: date-time
                type: string
              managedRolesStatus:
                description: ManagedRolesStatus tracks the reconciliation status of
                  managed roles.
                properties:
                  conflicts:
                    description: Conflicts contains non-fatal role ownership conflicts
                      detected while computing desired roles.
                    items:
                      description: RoleConflict records a role-level ownership conflict.
                      properties:
                        attemptedBy:
                          description: AttemptedBy is the PostgresDatabase whose claim
                            was withheld.
                          properties:
                            name:
                              description: Name is the owning PostgresDatabase name.
                              minLength: 1
                              type: string
                            uid:
                              description: UID is the owning PostgresDatabase UID.
                              minLength: 1
                              type: string
                          required:
                          - name
                          - uid
                          type: object
                        claimedBy:
                          description: ClaimedBy is the incumbent or winner, when
                            one exists.
                          properties:
                            name:
                              description: Name is the owning PostgresDatabase name.
                              minLength: 1
                              type: string
                            uid:
                              description: UID is the owning PostgresDatabase UID.
                              minLength: 1
                              type: string
                          required:
                          - name
                          - uid
                          type: object
                        role:
                          description: Role is the contested PostgreSQL role name.
                          minLength: 1
                          type: string
                      required:
                      - role
                      type: object
                    type: array
                  failed:
                    additionalProperties:
                      type: string
                    description: Failed contains roles that failed to reconcile with
                      error messages.
                    type: object
                  pending:
                    description: Pending contains roles that are being created but
                      not yet ready.
