workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

stages:
  - verify
  - test
  - build
  - image_scan
  - integration

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOTOOLCHAIN: "auto"
  GOWORK: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/golang-1.25-aws:5.1.0
  interruptible: true
  before_script:
    - |
      set -eu
      export GOTOOLCHAIN="${GOTOOLCHAIN:-auto}"
      rm -rf .cache/go
      go version

format-and-vet:
  stage: verify
  script:
    - make fmt
    - make vet
    - git diff --exit-code

unit-tests:
  stage: test
  needs:
    - format-and-vet
  variables:
    GOFLAGS: ""
  script:
    - make setup/ginkgo
    - go mod tidy
    - make test
    - go tool cover -func=coverage.out | tee coverage-summary.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage-summary.txt
      - unit_test.xml
    reports:
      junit: unit_test.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

kubectl-splunk-tests:
  stage: test
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - rm -rf .cache/go
    - ensure_python_venv_tooling
    - python3 --version
  script:
    - python3 -m venv /tmp/kubectl-splunk-venv
    - . /tmp/kubectl-splunk-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r tools/kubectl-splunk/requirements.txt
    - pip install -e tools/kubectl-splunk
    - pip install coverage pytest
    - cd tools/kubectl-splunk
    - coverage run -m unittest discover -s tests
    - coverage report | tee "$CI_PROJECT_DIR/kubectl-splunk-coverage-summary.txt"
    - coverage xml -o "$CI_PROJECT_DIR/kubectl-splunk-coverage.xml"
  artifacts:
    when: always
    paths:
      - kubectl-splunk-coverage-summary.txt
      - kubectl-splunk-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: kubectl-splunk-coverage.xml

build-stage-image:
  stage: build
  needs:
    - unit-tests
    - kubectl-splunk-tests
  variables:
    WORKFLOW_SLUG: build-test-push-workflow
    BUILDER_IMAGE: golang:1.25.8
  script:
    - gitlab-ci/build-test-push.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/build-test-push-workflow-*
      - ci-output/build-test-push-workflow-image-ref.txt
      - ci-output/build-test-push-workflow-digest.txt
      - ci-output/build-test-push-workflow-runtime-context.txt

scan-stage-image-trivy:
  stage: image_scan
  needs:
    - job: build-stage-image
      artifacts: true
  variables:
    WORKFLOW_SLUG: scan-stage-image-trivy
  script:
    - gitlab-ci/build-test-push-trivy-scan.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/scan-stage-image-trivy-*
      - ci-output/scan-stage-image-trivy-trivy-results.sarif
      - ci-output/scan-stage-image-trivy-trivy-results.txt
      - ci-output/scan-stage-image-trivy-runtime-context.txt

eks-smoke-validation:
  stage: integration
  interruptible: false
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  variables:
    WORKFLOW_SLUG: int-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: managersecret-smoke-s1
    JOB_INT_TEST_TIMEOUT: 3h
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/
    reports:
      junit: ci-output/int-test-workflow-inttest-junit.xml
