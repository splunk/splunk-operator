workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_admin_daily"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_intake"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_mirror_health"'
    # Qualification must support both manual starts and orchestrated downstream
    # starts from release-management pipelines.
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger|pipeline|parent_pipeline)$/ && $SOK_PIPELINE_MODE == "qualification_lane"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $SOK_PIPELINE_MODE == "release_publish"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge /'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release([\/-]).+$/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

include:
  - local: gitlab-ci/includes/base.yml
  - local: gitlab-ci/includes/baseline.yml
  - local: gitlab-ci/includes/runtime.yml
  - local: gitlab-ci/includes/qualification.yml
  - local: gitlab-ci/includes/admin.yml
  - local: gitlab-ci/includes/release.yml
  - project: 'ci-cd/templates'
    ref: main
    file: '/prodsec/.oss-scan.yml'
  - project: 'ci-cd/templates'
    ref: main
    file: '/prodsec/.container-scan.yml'
    rules:
      - if: '$CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_REF_NAME == "develop"'
  - project: 'ci-cd/templates'
    ref: docker-test
    file: '/prodsec/.container-scan.yml'
    rules:
      - if: '$CI_COMMIT_REF_NAME != "main" && $CI_COMMIT_REF_NAME != "develop"'

oss-scan:
  stage: test
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - when: on_success
  needs:
    - format-and-vet
  extends:
    - .oss-scan
    - .rules-default-validation-lane
  # The shared prodsec scanner image should run with its own bootstrap only.
  # Inheriting the repo default before_script causes the job to execute Go setup
  # inside the scanner container before FOSSA starts.
  before_script: []
  allow_failure: true
