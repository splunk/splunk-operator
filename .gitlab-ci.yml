workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge /'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

include:
  - local: gitlab-ci/includes/base.yml
  - local: gitlab-ci/includes/baseline.yml
  - local: gitlab-ci/includes/runtime.yml
  - project: 'ci-cd/templates'
    ref: main
    file: '/prodsec/.oss-scan.yml'

oss-scan:
  stage: test
  needs:
    - format-and-vet
  extends: .oss-scan
  # The shared prodsec scanner image should run with its own bootstrap only.
  # Inheriting the repo default before_script causes the job to execute Go setup
  # inside the scanner container before FOSSA starts.
  before_script: []
  allow_failure: true
