---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      set -eu

      access_key="${AWS_INDEX_INGEST_SEP_ACCESS_KEY_ID:-${TEST_S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}}"
      secret_key="${AWS_INDEX_INGEST_SEP_SECRET_ACCESS_KEY:-${TEST_S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}}"

      if [ -z "${access_key}" ]; then
        echo "Missing index/ingest AWS access key" >&2
        exit 1
      fi

      if [ -z "${secret_key}" ]; then
        echo "Missing index/ingest AWS secret key" >&2
        exit 1
      fi

      kubectl create secret generic index-ing-sep-secret \
        --from-literal="s3_access_key=${access_key}" \
        --from-literal="s3_secret_key=${secret_key}" \
        --namespace "${NAMESPACE}"
    background: false
    skipLogOutput: true
