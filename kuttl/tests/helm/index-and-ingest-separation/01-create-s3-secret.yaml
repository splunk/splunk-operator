---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      set -eu

      access_key="${AWS_ACCESS_KEY_ID:-}"
      secret_key="${AWS_SECRET_ACCESS_KEY:-}"
      session_token="${AWS_SESSION_TOKEN:-}"

      if [ -z "${access_key}" ]; then
        echo "Missing index/ingest AWS access key" >&2
        exit 1
      fi

      if [ -z "${secret_key}" ]; then
        echo "Missing index/ingest AWS secret key" >&2
        exit 1
      fi

      kubectl create secret generic index-ing-sep-secret \
        --from-literal="s3_access_key=${access_key}" \
        --from-literal="s3_secret_key=${secret_key}" \
        --from-literal="s3_session_token=${session_token}" \
        --namespace "${NAMESPACE}"
    background: false
    skipLogOutput: true
