---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: pwd
    background: false
  - script: yq -i '.clusterManager.appRepo.defaults.volumeName = "volume_app_repo"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.defaults.scope = "local"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.appSources[0].name = "apps"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.appSources[0].location = "appframework"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.appSources[0].scope = "cluster"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.volumes[0].name = "volume_app_repo"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.volumes[0].storageType = "s3"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.volumes[0].provider = "aws"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.appRepo.volumes[0].path = \"helm-test-c3-with-apps-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.clusterManager.appRepo.volumes[0].endpoint = "https://s3-us-west-2.amazonaws.com"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.appRepo.volumes[0].region = \"${S3_REGION}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: pwd
    background: false
  - script: yq -i '.searchHeadCluster.appRepo.defaults.volumeName = "volume_app_repo"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.defaults.scope = "local"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.appSources[0].name = "apps"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.appSources[0].location = "appframework"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.appSources[0].scope = "cluster"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.volumes[0].name = "volume_app_repo"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.volumes[0].storageType = "s3"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.volumes[0].provider = "aws"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".searchHeadCluster.appRepo.volumes[0].path = \"helm-test-c3-with-apps-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i '.searchHeadCluster.appRepo.volumes[0].endpoint = "https://s3-us-west-2.amazonaws.com"' c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".searchHeadCluster.appRepo.volumes[0].region = \"${S3_REGION}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.smartstore.defaults.volumeName = \"helm-test-c3-with-apps-smartstore-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.smartstore.indexes[0].volumeName = \"helm-test-c3-with-apps-smartstore-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.smartstore.indexes[1].volumeName = \"helm-test-c3-with-apps-smartstore-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.smartstore.volumes[0].name = \"helm-test-c3-with-apps-smartstore-${NAMESPACE}\"" c3_config.yaml
    background: false
    skipLogOutput: true
  - script: yq -i ".clusterManager.smartstore.volumes[0].path = \"helm-test-c3-with-apps-smartstore-${NAMESPACE}/smartstore\"" c3_config.yaml
    background: false
    skipLogOutput: true
