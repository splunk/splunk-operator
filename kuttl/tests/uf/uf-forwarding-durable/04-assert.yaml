apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 900
collectors:
  - type: command
    command: bash -c "kubectl get deployment,pod,pvc -n $NAMESPACE -o wide"
  - type: command
    command: bash -c "kubectl describe pvc -n $NAMESPACE"
  - type: command
    command: bash -c "kubectl get events -n $NAMESPACE --sort-by=.lastTimestamp"
  - type: command
    command: bash -c "kubectl logs -n $NAMESPACE -l app.kubernetes.io/instance=splunk-uf-durable --all-containers --tail=200 || true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-uf-durable-splunk-universalforwarder-deploy
status:
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splunk-uf-durable-splunk-universalforwarder-etc
status:
  phase: Bound
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splunk-uf-durable-splunk-universalforwarder-var
status:
  phase: Bound
