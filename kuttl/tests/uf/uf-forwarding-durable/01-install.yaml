apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Install splunk-operator and a Standalone forwarding target. The dedicated
  # uf-gp3 StorageClass is used only by the UF chart installed in the next step.
  - script: |
      OP=''
      ENT=''
      [ -n "${KUTTL_SPLUNK_OPERATOR_IMAGE:-}" ] && OP="--set splunk-operator.splunkOperator.image.repository=$KUTTL_SPLUNK_OPERATOR_IMAGE"
      [ -n "${KUTTL_SPLUNK_ENTERPRISE_IMAGE:-}" ] && ENT="--set splunk-operator.image.repository=$KUTTL_SPLUNK_ENTERPRISE_IMAGE"
      helm install splunk-uf-durable-test ../../../../helm-chart/splunk-enterprise \
        -f uf_config.yaml \
        --namespace "$NAMESPACE" \
        --set splunk-operator.splunkOperator.clusterWideAccess=false \
        --set splunk-operator.splunkOperator.persistentVolumeClaim.storageClassName=gp2 \
        --set splunk-operator.splunkOperator.splunkGeneralTerms=--accept-sgt-current-at-splunk-com \
        $OP $ENT
