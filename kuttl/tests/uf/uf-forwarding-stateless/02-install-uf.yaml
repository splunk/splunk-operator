apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Install UF chart in stateless mode (default: storage.emptyDir=true).
  # KUTTL_SPLUNK_UF_IMAGE is docker.io/splunk/universalforwarder:<tag> — falls back
  # to chart default if env var is unset.
  - script: |
      EXTRA=''
      if [ -n "${KUTTL_SPLUNK_UF_IMAGE:-}" ]; then
        EXTRA="--set image.repository=${KUTTL_SPLUNK_UF_IMAGE%:*} --set image.tag=${KUTTL_SPLUNK_UF_IMAGE##*:}"
      fi
      helm install splunk-uf ../../../../helm-chart/splunk-universalforwarder \
        --namespace "$NAMESPACE" \
        --wait \
        --timeout 15m \
        --set "splunkConfig.forwardServer=splunk-stdln-standalone-service.$NAMESPACE.svc.cluster.local:9997" \
        --set splunkConfig.password=TestPassword1 \
        --set splunkConfig.splunkGeneralTerms=--accept-sgt-current-at-splunk-com \
        $EXTRA
