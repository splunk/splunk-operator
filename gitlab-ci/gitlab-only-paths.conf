# Paths that exist only on GitLab and are never mirrored to GitHub.
#
# Single source of truth, consumed by:
#   - gitlab-ci/validate-no-private-refs.sh
#       These paths are allowed to reference docs/splunk_private/ because
#       they are stripped before the mirror push, so the reference can
#       never dangle on GitHub.
#   - the GitHub mirror push job (strips these paths before pushing).
#
# For the full mirror process and implications for open PRs, see:
#   docs/splunk_private/GitHubMirrorRunbook.md
#
# Format: one path prefix per line. A trailing slash denotes a directory;
# a path without one matches a file. Blank lines and lines beginning with
# '#' are ignored; inline '#' comments and surrounding whitespace are stripped.
.gitlab/
gitlab-ci/
docs/splunk_private/
.gitlab-ci.yml
