released-sok-contract:
  extends:
    - .python-venv-job
    - .rules-qualification-lane
  id_tokens:
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  # Qualification runtime jobs in image_scan/integration consume this contract,
  # so it must exist before those stages begin.
  stage: verify
  needs:
    - format-and-vet
  script:
    - |
      set -eu
      . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
      require_commands docker
      ensure_artifactory_docker_reader_creds
      python3 gitlab-ci/released-sok-contract.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

qualification-manifest:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  # The manifest is metadata only. Running it in verify keeps the later report
  # job free of a long hardcoded integration-needs list.
  stage: verify
  needs:
    - job: released-sok-contract
      artifacts: true
  script:
    - python3 gitlab-ci/qualification-manifest.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

qualification-report:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  when: always
  # All required evidence jobs are in earlier stages now, so qualification
  # report can use stage ordering and collect artifacts without per-suite needs.
  script:
    - python3 gitlab-ci/qualification-report.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

compatibility-publish:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  when: always
  needs:
    - job: qualification-report
      artifacts: true
  script:
    - python3 gitlab-ci/compatibility-publish.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

qualification-gate:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  # This is the authoritative go/no-go signal for the qualification lane after
  # report generation and compatibility artifact publication have run.
  when: always
  needs:
    - job: qualification-report
      artifacts: true
  script:
    - python3 gitlab-ci/qualification-gate.py
