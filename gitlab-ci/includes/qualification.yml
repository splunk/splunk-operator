qualification-manifest:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  stage: verify
  needs:
    - format-and-vet
  script:
    - python3 gitlab-ci/qualification-manifest.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

qualification-report:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  needs:
    - job: qualification-manifest
      artifacts: true
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
      artifacts: true
    - job: gosec-scan
      artifacts: true
    - job: govulncheck-scan
      artifacts: true
    - job: eks-qualification-integration-validation
      artifacts: true
    - job: helm-eks-validation
      artifacts: true
  script:
    - python3 gitlab-ci/qualification-report.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/

compatibility-publish:
  extends:
    - .python-qualification-job
    - .rules-qualification-lane
  needs:
    - job: qualification-report
      artifacts: true
  script:
    - python3 gitlab-ci/compatibility-publish.py
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-output/release-controller/
