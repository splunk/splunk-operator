.pages-build:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/ruby-3.4-trixie:5.9.1
  before_script: []
  variables:
    BUNDLE_GEMFILE: splunk_private/Gemfile.gitlab
    BUNDLE_PATH: vendor/bundle
  cache:
    key:
      files:
        - docs/splunk_private/Gemfile.gitlab
        - docs/splunk_private/Gemfile.gitlab.lock
    paths:
      - docs/vendor/bundle
    policy: pull-push
  script:
    - cd docs
    - gem install bundler
    - bundle install --jobs 4 --retry 3
    - bundle exec jekyll build --config _config.yml,splunk_private/_config_gitlab.yml -d ../public
    - printf "/splunk-operator /splunk-operator/ 301\n" > ../public/_redirects

pages-deploy:
  extends: .pages-build
  stage: build
  artifacts:
    paths:
      - public
  pages:
    path_prefix: ""
  rules:
    - if: '$SOK_PIPELINE_MODE'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/**/*
        - gitlab-ci/includes/pages.yml

