github-intake-backfill:
  extends:
    - .python-admin-job
    - .rules-github-intake-lane
  variables:
    WORKFLOW_SLUG: github-intake-backfill
    PIPELINE_GITHUB_INTAKE_REPOSITORY: "splunk/splunk-operator"
  script:
    - sh gitlab-ci/github-intake-automation.sh
  artifacts:
    paths:
      - ci-output/

github-intake-daily-backfill:
  extends:
    - .python-admin-job
    - .rules-github-admin-daily-lane
  variables:
    WORKFLOW_SLUG: github-intake-daily-backfill
    PIPELINE_GITHUB_INTAKE_REPOSITORY: "splunk/splunk-operator"
    PIPELINE_GITHUB_INTAKE_AUTO_DISCOVER: "true"
    PIPELINE_GITHUB_INTAKE_LOOKBACK_DAYS: "7"
  script:
    - sh gitlab-ci/github-intake-automation.sh
  artifacts:
    paths:
      - ci-output/

github-mirror-health-check:
  extends:
    - .admin-job
    - .rules-github-mirror-health-lane
  variables:
    WORKFLOW_SLUG: github-mirror-health-check
    PIPELINE_GITHUB_MIRROR_REPO: "splunk/splunk-operator"
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - install_os_packages git
    - git --version
  script:
    - sh gitlab-ci/mirror-health-check.sh
  artifacts:
    paths:
      - ci-output/

github-mirror-daily-health-check:
  extends:
    - .admin-job
    - .rules-github-admin-daily-lane
  variables:
    WORKFLOW_SLUG: github-mirror-daily-health-check
    PIPELINE_GITHUB_MIRROR_REPO: "splunk/splunk-operator"
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - install_os_packages git
    - git --version
  script:
    - sh gitlab-ci/mirror-health-check.sh
  artifacts:
    paths:
      - ci-output/
