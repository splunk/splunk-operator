stages:
  - verify
  - test
  - build
  - image_scan
  - integration

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOTOOLCHAIN: "auto"
  GOWORK: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/golang-1.25-aws:5.1.0
  interruptible: true
  before_script:
    - |
      set -eu
      go version

# Current minimal-lane contract: map the staged project variables into the
# standard AWS environment expected by the build, scan, and smoke scripts.
# The later auth-hardening MR will replace this with project onboarding for
# ephemeral creds-helper / Vault roles.
.aws-staging-env-job:
  variables:
    AWS_ACCESS_KEY_ID: $STAGING_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $STAGING_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $STAGING_AWS_DEFAULT_REGION
