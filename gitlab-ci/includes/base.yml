stages:
  - verify
  - test
  - build
  - image_scan
  - security
  - integration
  - qualification
  - release
  - publish

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOTOOLCHAIN: "auto"
  GOWORK: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/golang-1.26-aws:6.1.0
  interruptible: true
  before_script:
    - |
      set -eu
      go version

# CI variable contract:
# - PIPELINE_* values come from project/group settings or manual pipeline inputs.
# - JOB_* values are lane-local defaults defined in YAML.
# Runtime scripts always prefer PIPELINE_* over JOB_* so operators can override
# a lane without editing repo code.
#
# Shared nonprod AWS contract for the current develop, nightly, and
# qualification lanes. The repo now uses only the neutral PIPELINE_* names.
.aws-pipeline-env-job:
  variables:
    AWS_ACCESS_KEY_ID: $PIPELINE_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $PIPELINE_AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $PIPELINE_AWS_DEFAULT_REGION

.go-verify-job:
  stage: verify
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - when: on_success

.go-test-job:
  stage: test
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - when: on_success

.runtime-artifact-job:
  artifacts:
    when: always
    expire_in: 90 days

.creds-helper-job:
  id_tokens:
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  before_script:
    - creds-helper init
    - |
      if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ] && { [ "${CI_COMMIT_REF_NAME}" = "main" ] || [ "${CI_COMMIT_REF_NAME}" = "develop" ] || printf '%s' "${CI_COMMIT_REF_NAME}" | grep -Eq '^release([/-]).+$'; }; then
        export DOCKER_PATH=artifactory:v2/cloud/role/sok-docker-deployer-role
        export HELM_DEPLOYER_PATH=artifactory:v2/cloud/role/helm-deployer-role
        export GENERIC_DEPLOYER_PATH=artifactory:v2/cloud/role/sok-generic-deployer-role
      else
        export DOCKER_PATH=artifactory:v2/cloud/role/sok-docker-test-deployer-role
        export HELM_DEPLOYER_PATH=artifactory:v2/cloud/role/helm-test-deployer-role
        export GENERIC_DEPLOYER_PATH=artifactory:v2/cloud/role/generic-test-deployer-role
      fi
    - eval $(creds-helper docker --eval $DOCKER_PATH)
    - eval $(creds-helper artifactory --eval $HELM_DEPLOYER_PATH)

.release-chart-publish-creds-helper-job:
  id_tokens:
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  before_script:
    - creds-helper init
    - eval $(creds-helper artifactory --eval artifactory:v2/cloud/role/helm-deployer-role)

.release-chart-read-creds-helper-job:
  id_tokens:
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  before_script:
    - creds-helper init
    - |
      if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ] && { [ "${CI_COMMIT_REF_NAME}" = "main" ] || [ "${CI_COMMIT_REF_NAME}" = "develop" ] || printf '%s' "${CI_COMMIT_REF_NAME}" | grep -Eq '^release([/-]).+$'; }; then
        export HELM_READER_PATH=artifactory:v2/cloud/role/helm-reader-role
      else
        export HELM_READER_PATH=artifactory:v2/cloud/role/helm-test-reader-role
      fi
    - eval $(creds-helper artifactory --eval $HELM_READER_PATH)

.runtime-build-job:
  extends:
    - .runtime-artifact-job
    - .aws-pipeline-env-job
    - .creds-helper-job
  stage: build

.runtime-image-scan-job:
  extends:
    - .runtime-artifact-job
    - .aws-pipeline-env-job
  stage: image_scan

.runtime-integration-job:
  extends:
    - .runtime-artifact-job
    - .aws-pipeline-env-job
  stage: integration
  interruptible: false

.security-job:
  stage: security

.qualification-job:
  extends: .runtime-artifact-job
  stage: qualification

.admin-job:
  extends: .runtime-artifact-job
  stage: publish

.release-artifact-job:
  extends: .runtime-artifact-job
  stage: release

.release-publish-job:
  extends:
    - .runtime-artifact-job
    - .aws-pipeline-env-job
  stage: publish

.python-venv-job:
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - ensure_python_venv_tooling
    - python3 --version

.python-qualification-job:
  extends:
    - .qualification-job
    - .python-venv-job

.python-admin-job:
  extends:
    - .admin-job
    - .python-venv-job

.kubectl-splunk-python-job:
  extends: .python-venv-job
  # GitLab replaces before_script on extend, so this intentionally repeats the
  # parent bootstrap before adding the kubectl-splunk-specific virtualenv setup.
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - ensure_python_venv_tooling
    - python3 --version
    - python3 -m venv /tmp/kubectl-splunk-venv
    - . /tmp/kubectl-splunk-venv/bin/activate
    - pip install --upgrade pip
    - pip install coverage pytest
    - pip install -r tools/kubectl-splunk/requirements.txt
    - pip install -e tools/kubectl-splunk

.rules-qualification-lane:
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'

.rules-github-intake-lane:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_intake"'

.rules-github-mirror-health-lane:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_mirror_health"'

.rules-github-admin-daily-lane:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ && $SOK_PIPELINE_MODE == "github_admin_daily"'

# Auto GitLab->GitHub mirror push, on the post-merge pipeline of a protected
# mirrored branch (develop/main). Dormant until PIPELINE_GITHUB_MIRROR_PUSH_ENABLED
# is set "true" (do this only AFTER the first cutover). The push script is
# fast-forward-only here: a non-fast-forward fails closed (no MIRROR_ALLOW_NON_FF),
# so an accidental history rewrite can never be auto-published. Never runs in MR
# pipelines or the scheduled github_* admin lanes.
.rules-github-mirror-push-lane:
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$PIPELINE_GITHUB_MIRROR_PUSH_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main") && $PIPELINE_GITHUB_APP_ID'

# Manual mirror cutover / exclusion-list change — the only times a
# non-fast-forward is expected (MIRROR_ALLOW_NON_FF=1). Selectable once the App
# credentials are loaded (PIPELINE_GITHUB_APP_ID set); must be drained per the
# mirror runbook before triggering. Manual so it is never run automatically.
.rules-github-mirror-cutover-lane:
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main") && $PIPELINE_GITHUB_APP_ID'
      when: manual
      allow_failure: true

.rules-default-validation-lane:
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - when: on_success

.rules-merge-request-event:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Release validation runs on release branches, reviewed release-target MRs, and
# on the merged main commit. Support both release/<version> and
# release-<version> naming.
.rules-release-validation-lane:
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

# Publish remains intentionally gated. Normal releases publish from the merged
# main pipeline; maintenance patch releases publish from a dedicated web/api
# release_publish pipeline on the protected release/* branch.
.rules-release-publish:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $SOK_PIPELINE_MODE == "release_publish" && $CI_COMMIT_BRANCH =~ /^(main|release([\/-]).+)$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual

# Release publish contract:
# - PIPELINE_RELEASE_VERSION defaults to Makefile VERSION.
# - PIPELINE_RELEASE_OPERATOR_TAG defaults to PIPELINE_RELEASE_VERSION.
# - PIPELINE_RELEASE_CANDIDATE_NUMBER defaults to 1 and becomes the rc tag suffix.
# - PIPELINE_RELEASE_IMAGE_REPOSITORY defaults to docker.io/splunk/splunk-operator.
# - PIPELINE_RELEASE_SOURCE_REF optionally pins which retained release branch the publish jobs fetch.
# - PIPELINE_RELEASE_SOURCE_PIPELINE_ID optionally pins the exact validated release pipeline to promote.
# - PIPELINE_RELEASE_CANDIDATE_JOB_NAME defaults to release-candidate-packaging.
# - PIPELINE_DOCKER_USERNAME / PIPELINE_DOCKER_PASSWORD provide generic OCI auth.
# - PIPELINE_BUNDLE_REGISTRY is the bundle/catalog target registry.
# - Helm chart publication uses fixed internal Artifactory repositories and
#   fixed VRG roles: release charts publish to `helm`, protected stage refs
#   publish to `helm`, and other stage refs publish to `helm-test`.
# - PIPELINE_HELM_CHART_VERSION / PIPELINE_HELM_CHART_APP_VERSION optionally
#   override the generated develop snapshot chart metadata.
# - PIPELINE_PYXIS_API_TOKEN and PIPELINE_PYXIS_CERTIFICATION_COMPONENT_ID
#   unlock Red Hat preflight submission.
#
# Expanded runtime validation contract:
# - PIPELINE_RUNTIME_ENTERPRISE_IMAGE overrides the default runtime enterprise
#   image pin for any lane that needs a specific enterprise image.
# - PIPELINE_ENABLE_GRAVITON=true enables the Graviton or arm64 runtime suites.
# - PIPELINE_GRAVITON_ENTERPRISE_IMAGE optionally overrides the default runtime
#   enterprise image only when the arm64 cycle needs a different repo:tag.
# - PIPELINE_FIPS_EKS_CLUSTER_NAME points qualification/release FIPS jobs at the
#   approved existing EKS cluster. Those jobs are skipped entirely when it is unset.
# - PIPELINE_AZURE_* configures AKS, ACR, and Azure storage validation.
# - PIPELINE_GCP_* configures GKE, Artifact Registry, and GCS validation.
# - PIPELINE_GITLAB_RELEASE_API_TOKEN optionally overrides CI_JOB_TOKEN for
#   GitLab Release and Generic Package Registry writes.
# - PIPELINE_GITLAB_RELEASE_PACKAGE_NAME overrides the package name used for
#   stable release-record assets.
