stages:
  - verify
  - test
  - build
  - image_scan
  - integration

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOTOOLCHAIN: "auto"
  GOWORK: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/golang-1.25-aws:5.1.0
  interruptible: true
  before_script:
    - |
      set -eu
      export GOTOOLCHAIN="${GOTOOLCHAIN:-auto}"
      go version

.go-verify-job:
  stage: verify

.go-test-job:
  stage: test

.runtime-artifact-job:
  artifacts:
    when: always
    expire_in: 90 days

.runtime-build-job:
  extends: .runtime-artifact-job
  stage: build

.runtime-image-scan-job:
  extends: .runtime-artifact-job
  stage: image_scan

.runtime-integration-job:
  extends: .runtime-artifact-job
  stage: integration
  interruptible: false

.python-venv-job:
  before_script:
    - . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
    - ensure_python_venv_tooling
    - python3 --version
