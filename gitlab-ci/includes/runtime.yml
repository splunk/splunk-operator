helm-eks-validation:
  extends: .runtime-released-sok-validation-job
  allow_failure: true
  timeout: 10h
  variables:
    WORKFLOW_SLUG: helm-test-workflow
    JOB_HELM_TEST_PROFILE: full
    JOB_HELM_TEST_TIMEOUT: "7000"
  script:
    - gitlab-ci/helm-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/helm-test-workflow-kuttl-junit.xml

# Nightly integration fan-out follows the old GitHub nightly integration matrix:
# one suite per job and one EKS cluster per suite instead of a single large run.
.runtime-nightly-integration-suite-job:
  extends: .runtime-integration-job
  timeout: 4h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: full
    JOB_INT_TEST_TIMEOUT: 225m
    JOB_INT_TEST_TO_SKIP: '^(?:[^i]+|i(?:$|[^n]|n(?:$|[^t]|t(?:$|[^e]|e(?:$|[^g]|g(?:$|[^r]|r(?:$|[^a]|a(?:$|[^t]|t(?:$|[^i]|i(?:$|[^o]|o(?:$|[^n])))))))))))*$'
    JOB_EKS_CLUSTER_TEST_TYPE: integration
    JOB_EKS_CLUSTER_PLATFORM_SUFFIX: nightly
    JOB_INT_CLUSTER_NODES: "1"
    JOB_INT_CLUSTER_WORKERS: "3"
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

