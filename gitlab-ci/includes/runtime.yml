build-stage-image:
  stage: build
  needs:
    - unit-tests
    - kubectl-splunk-tests
  variables:
    WORKFLOW_SLUG: build-test-push-workflow
    BUILDER_IMAGE: golang:1.25.8
  script:
    - gitlab-ci/build-test-push.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/build-test-push-workflow-*
      - ci-output/build-test-push-workflow-image-ref.txt
      - ci-output/build-test-push-workflow-digest.txt
      - ci-output/build-test-push-workflow-runtime-context.txt

scan-stage-image-trivy:
  stage: image_scan
  needs:
    - job: build-stage-image
      artifacts: true
  variables:
    WORKFLOW_SLUG: scan-stage-image-trivy
  script:
    - gitlab-ci/build-test-push-trivy-scan.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/scan-stage-image-trivy-*
      - ci-output/scan-stage-image-trivy-trivy-results.sarif
      - ci-output/scan-stage-image-trivy-trivy-results.txt
      - ci-output/scan-stage-image-trivy-runtime-context.txt

eks-smoke-validation:
  stage: integration
  interruptible: false
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  variables:
    WORKFLOW_SLUG: int-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: managersecret-smoke-s1
    JOB_INT_TEST_TIMEOUT: 3h
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-output/
    reports:
      junit: ci-output/int-test-workflow-inttest-junit.xml
