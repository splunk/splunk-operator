# Nightly integration fan-out follows the old GitHub nightly integration matrix:
# one suite per job and one EKS cluster per suite instead of a single large run.
.runtime-nightly-integration-suite-job:
  extends: .runtime-integration-job
  timeout: 5h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-container
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
