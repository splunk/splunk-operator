build-stage-image:
  extends: .runtime-build-job
  needs:
    - unit-tests
    - kubectl-splunk-tests
  variables:
    WORKFLOW_SLUG: build-test-push-workflow
  script:
    - gitlab-ci/build-test-push.sh
  artifacts:
    paths:
      - ci-output/build-test-push-workflow-*

scan-stage-image-trivy:
  extends: .runtime-image-scan-job
  needs:
    - job: build-stage-image
      artifacts: true
  variables:
    WORKFLOW_SLUG: scan-stage-image-trivy
  script:
    - gitlab-ci/build-test-push-trivy-scan.sh
  artifacts:
    paths:
      - ci-output/scan-stage-image-trivy-*

eks-smoke-validation:
  extends: .runtime-integration-job
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge /'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: int-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: smoke
    PIPELINE_INT_TEST_FOCUS: "smoke, basic, s1"
    JOB_INT_TEST_TIMEOUT: 3h
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/int-test-workflow-inttest-junit.xml

eks-qualification-integration-validation:
  extends: .runtime-integration-job
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
  variables:
    WORKFLOW_SLUG: qualification-int-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: full
    JOB_INT_TEST_TIMEOUT: 8h
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/qualification-int-test-workflow-inttest-junit.xml

helm-eks-validation:
  extends: .runtime-integration-job
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
  variables:
    WORKFLOW_SLUG: helm-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_HELM_TEST_PROFILE: full
    JOB_HELM_TEST_TIMEOUT: "7000"
  script:
    - gitlab-ci/helm-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/helm-test-workflow-kuttl-junit.xml

nightly-eks-integration-validation:
  extends: .runtime-integration-job
  timeout: 10h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: nightly-int-test-workflow
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: full
    JOB_INT_TEST_TIMEOUT: 8h
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/nightly-int-test-workflow-inttest-junit.xml
