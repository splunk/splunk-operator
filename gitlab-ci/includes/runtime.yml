build-stage-image:
  extends: .runtime-build-job
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release([\/-]).+$/'
      variables:
        JOB_BUILD_DISTROLESS: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release([\/-]).+$/'
      variables:
        JOB_BUILD_DISTROLESS: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release([\/-]).+$/'
      variables:
        JOB_BUILD_DISTROLESS: "true"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      variables:
        JOB_BUILD_DISTROLESS: "true"
    # Nightly scheduled runs on develop share a HEAD SHA with the push-triggered
    # pipeline that already pushed that tag to Artifactory.  Artifactory's
    # immutable-tag / no-overwrite policy rejects a second push under the same
    # tag, causing the nightly build to fail even though the image is identical.
    # Appending the pipeline ID makes the nightly tag unique and avoids the
    # DELETE-permission collision entirely.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
      variables:
        JOB_IMAGE_TAG: "${CI_COMMIT_SHA}-${CI_PIPELINE_ID}"
    - when: on_success
  needs:
    - unit-tests
    - kubectl-splunk-tests
    - helm-chart-tests
  variables:
    WORKFLOW_SLUG: build-test-push-workflow
  script:
    - gitlab-ci/build-test-push.sh
  artifacts:
    paths:
      - ci-output/build-test-push-workflow-*

build-stage-charts:
  extends: .runtime-build-job
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - when: never
  needs:
    - job: build-stage-image
      artifacts: true
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-artifactory-image-ref.txt
    WORKFLOW_SLUG: build-stage-charts
  script:
    - gitlab-ci/publish-stage-charts.sh
  artifacts:
    paths:
      - ci-output/build-stage-charts-*

.runtime-image-container-scan-job:
  stage: image_scan
  extends:
    - .container-scan
    - .runtime-image-scan-job
  before_script:
    - |
      set -eu
      . "${CI_PROJECT_DIR}/gitlab-ci/lib/pipeline-common.sh"
      require_file "${BUILD_IMAGE_REF_FILE}" "container scan image reference"
      CONTAINER_IMAGE="$(cat "${BUILD_IMAGE_REF_FILE}")"
      require_nonempty "${CONTAINER_IMAGE}" "container scan image"
      export CONTAINER_IMAGE
      echo "Container scan image: ${CONTAINER_IMAGE}"

scan-stage-image-container:
  extends: .runtime-image-container-scan-job
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - when: on_success
  needs:
    - job: build-stage-image
      artifacts: true
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-artifactory-image-ref.txt
    WORKFLOW_SLUG: scan-stage-image-container

scan-released-operator-image-container:
  extends: .runtime-image-container-scan-job
  needs:
    - job: released-sok-contract
      artifacts: true
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/release-controller/released-operator-image-source.txt
    WORKFLOW_SLUG: scan-released-operator-image-container

.runtime-released-sok-validation-job:
  extends: .runtime-integration-job
  needs:
    - job: released-sok-contract
      artifacts: true
    - job: scan-released-operator-image-container
  rules:
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
  variables:
    RELEASED_SOK_CONTRACT_FILE: ci-output/release-controller/released-sok-contract.env

.runtime-released-sok-fips-job:
  extends: .runtime-released-sok-validation-job
  allow_failure: true
  timeout: 5h
  rules:
    - if: '$PIPELINE_FIPS_EKS_CLUSTER_NAME == null || $PIPELINE_FIPS_EKS_CLUSTER_NAME == ""'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
  variables:
    JOB_USE_EXISTING_CLUSTER: "true"
    JOB_EXISTING_CLUSTER_NAME: $PIPELINE_FIPS_EKS_CLUSTER_NAME
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

# Smoke validation now mirrors the old GitHub smoke matrix: one suite per job,
# one EKS cluster per job, and shared runtime logic through int-test-workflow.sh.
.runtime-smoke-suite-job:
  extends: .runtime-integration-job
  timeout: 5h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-container
  rules:
    - if: '$SOK_PIPELINE_MODE =~ /^(github_intake|github_mirror_health|github_admin_daily)$/'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release([\/-]).+$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release([\/-]).+$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release([\/-]).+$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge /'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-ecr-image-ref.txt
    JOB_INT_TEST_PROFILE: smoke
    JOB_INT_TEST_TIMEOUT: 225m
    JOB_EKS_CLUSTER_TEST_TYPE: smoke
    JOB_INT_CLUSTER_NODES: "1"
    JOB_INT_CLUSTER_WORKERS: "5"
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

# Qualification integration now mirrors the nightly fan-out shape: one suite
# per job, one EKS cluster per suite, and released-SOK runtime input instead of
# the staged branch image.
.runtime-qualification-integration-suite-job:
  extends: .runtime-released-sok-validation-job
  # Qualification jobs must still publish evidence so the report/gate path can
  # decide the final lane outcome instead of stopping at the first failed test.
  allow_failure: true
  timeout: 5h
  variables:
    JOB_INT_TEST_PROFILE: full
    JOB_INT_TEST_TIMEOUT: 225m
    JOB_EKS_CLUSTER_TEST_TYPE: int
    JOB_EKS_CLUSTER_PLATFORM_SUFFIX: qual
    JOB_INT_CLUSTER_NODES: "1"
    JOB_INT_CLUSTER_WORKERS: "5"
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

