gitlab-release-record:
  extends:
    - .release-publish-job
    - .rules-release-publish
  when: manual
  needs:
    - job: fetch-release-candidate
      artifacts: true
    - job: publish-release-images
      artifacts: true
    - job: publish-release-artifacts
      artifacts: true
    - job: publish-release-bundle
      artifacts: true
    - job: publish-release-charts
      artifacts: true
    - job: release-psr-qualification-plan
      artifacts: true
      optional: true
    - job: psr-release-qualification-collect
      artifacts: true
      optional: true
    - job: preflight-certification
      artifacts: true
      optional: true
    - job: prepare-certified-operators-submission
      artifacts: true
      optional: true
    - job: prepare-community-operators-submission
      artifacts: true
      optional: true
  variables:
    WORKFLOW_SLUG: gitlab-release-record
  script:
    - python3 gitlab-ci/gitlab-release-record.py
  artifacts:
    paths:
      - ci-output/gitlab-release-record-output/*
