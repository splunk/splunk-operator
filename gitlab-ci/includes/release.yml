release-candidate-packaging:
  extends:
    - .release-artifact-job
    - .aws-pipeline-env-job
    - .rules-release-validation-lane
  # Intentionally relies on stage ordering only. This job runs in `release`
  # after the release validation jobs finish in `integration`.
  dependencies:
    - build-stage-image
  variables:
    WORKFLOW_SLUG: release-candidate-packaging
  script:
    - gitlab-ci/release-candidate-artifacts.sh
  artifacts:
    paths:
      - ci-output/release-candidate-packaging-*

release-psr-qualification-plan:
  extends:
    - .release-artifact-job
    - .rules-release-validation-lane
  # Intentionally relies on normal stage ordering only. This job records the
  # PSR plan and does not consume runtime validation artifacts.
  variables:
    WORKFLOW_SLUG: release-psr-qualification-plan
  script:
    - gitlab-ci/psr-release-qualification.sh
  artifacts:
    paths:
      - ci-output/release-psr-qualification-plan-*
    reports:
      dotenv: ci-output/release-psr-qualification-plan-output/psr-plan.env

psr-release-qualification-dispatch:
  stage: release
  needs:
    - job: release-psr-qualification-plan
      artifacts: true
  rules:
    - when: never
  variables:
    TEST_TYPE: $SOK_PSR_TRIGGER_TEST_TYPE
    BASE_VERSION: $SOK_PSR_BASE_VERSION
    TARGET_VERSION: $SOK_PSR_TARGET_VERSION
    IMAGE_SPLUNK_ENTERPRISE: $SOK_ENTERPRISE_IMAGE
  trigger:
    project: $SOK_PSR_PROJECT_PATH
    branch: main
    strategy: depend
    forward:
      pipeline_variables: true

psr-release-qualification-collect:
  extends:
    - .python-venv-job
    - .release-artifact-job
    - .rules-release-validation-lane
  when: always
  needs:
    - job: release-psr-qualification-plan
      artifacts: true
    - job: psr-release-qualification-dispatch
      optional: true
  script:
    - python3 gitlab-ci/psr-release-qualification-collect.py
  artifacts:
    paths:
      - ci-output/release-controller/

fetch-release-candidate:
  extends:
    - .release-publish-job
    - .rules-release-publish
  variables:
    WORKFLOW_SLUG: fetch-release-candidate
  script:
    - gitlab-ci/fetch-release-candidate.sh
  artifacts:
