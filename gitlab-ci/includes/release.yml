.release-validation-integration-suite-job:
  extends:
    - .runtime-integration-job
    - .rules-release-validation-lane
  timeout: 5h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-trivy
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-image-ref.txt
    JOB_INT_TEST_PROFILE: full
    JOB_INT_TEST_TIMEOUT: 255m
    JOB_INT_TEST_TO_SKIP: '^(?:[^i]+|i(?:$|[^n]|n(?:$|[^t]|t(?:$|[^e]|e(?:$|[^g]|g(?:$|[^r]|r(?:$|[^a]|a(?:$|[^t]|t(?:$|[^i]|i(?:$|[^o]|o(?:$|[^n])))))))))))*$'
    JOB_EKS_CLUSTER_TEST_TYPE: integration
    JOB_EKS_CLUSTER_PLATFORM_SUFFIX: release
    JOB_INT_CLUSTER_NODES: "1"
    JOB_INT_CLUSTER_WORKERS: "3"
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

release-appframeworks-s1-validation:
  extends:
    - .release-validation-integration-suite-job
    - .runtime-appframework-suite-job
  variables:
    WORKFLOW_SLUG: release-appframeworks-s1-validation
    JOB_INT_TEST_FOCUS: appframeworksS1

