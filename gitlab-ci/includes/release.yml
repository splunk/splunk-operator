release-helm-validation:
  extends:
    - .release-validation-runtime-job
    - .release-chart-read-creds-helper-job
  timeout: 10h
  variables:
    WORKFLOW_SLUG: release-helm-validation
    JOB_HELM_TEST_PROFILE: full
    JOB_HELM_TEST_TIMEOUT: "7000"
  script:
    - gitlab-ci/helm-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/release-helm-validation-kuttl-junit.xml

.release-validation-azure-job:
  extends: .release-validation-runtime-job
  timeout: 10h
  # Match the platform-foundations Azure federated credential audience.
  id_tokens:
    AZURE_GITLAB_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - gitlab-ci/int-test-azure-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

.release-validation-gcp-job:
  extends: .release-validation-runtime-job
  timeout: 10h
  # Match the platform-foundations GCP workload identity provider audience.
  id_tokens:
    GCP_GITLAB_OIDC_TOKEN:
      aud: https://cd.splunkdev.com
  script:
    - gitlab-ci/int-test-gcp-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

.release-validation-distroless-suite-job:
  extends: .release-validation-integration-suite-job
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-ecr-distroless-image-ref.txt
    JOB_EKS_CLUSTER_PLATFORM_SUFFIX: release-distroless

.release-validation-graviton-suite-job:
  extends: .release-validation-integration-suite-job
  variables:
    JOB_EKS_CLUSTER_PLATFORM_SUFFIX: release-arm64
    JOB_USE_ARM64_CLUSTER: "true"
    JOB_GRAVITON_TESTING: "true"
    # Keep the arm runtime contract explicit like the old GitHub arm workflows.
    JOB_INT_ENTERPRISE_IMAGE: $PIPELINE_GRAVITON_ENTERPRISE_IMAGE

.release-validation-fips-job:
  extends: .runtime-integration-job
  timeout: 5h
  needs:
    - job: build-stage-image
      artifacts: true
    - job: scan-stage-image-container
  rules:
    - if: '$PIPELINE_FIPS_EKS_CLUSTER_NAME == ""'
      when: never
    - if: '$SOK_PIPELINE_MODE == "qualification_lane"'
      when: never
    - if: '$SOK_PIPELINE_MODE == "release_publish"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release([\/-]).+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  variables:
    BUILD_IMAGE_REF_FILE: ci-output/build-test-push-workflow-ecr-image-ref.txt
    JOB_USE_EXISTING_CLUSTER: "true"
    JOB_EXISTING_CLUSTER_NAME: $PIPELINE_FIPS_EKS_CLUSTER_NAME
  script:
    - gitlab-ci/int-test-workflow.sh
  artifacts:
    paths:
      - ci-output/
    reports:
      junit: ci-output/*-inttest-junit.xml

release-azure-validation:
  extends: .release-validation-azure-job
  variables:
    WORKFLOW_SLUG: release-azure-validation
    JOB_CLOUD_TEST_FOCUS: azure_sanity
    JOB_CLOUD_TEST_TIMEOUT: 225m

release-gcp-c3-validation:
