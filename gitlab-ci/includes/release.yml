  variables:
    WORKFLOW_SLUG: release-managersmartstore-validation
    JOB_INT_TEST_FOCUS: managersmartstore

release-managermc1-validation:
  extends: .release-validation-integration-suite-job
  variables:
    WORKFLOW_SLUG: release-managermc1-validation
    JOB_INT_TEST_FOCUS: managermc1

release-managermc2-validation:
