merge-request-description-check:
  extends:
    - .go-verify-job
    - .rules-merge-request-event
  script:
    - sh gitlab-ci/validate-merge-request-description.sh

private-docs-reference-check:
  extends:
    - .go-verify-job
  script:
    - bash gitlab-ci/validate-no-private-refs.sh

ai-config-files-check:
  extends:
    - .go-verify-job
  script:
    - bash gitlab-ci/validate-no-ai-config-files.sh

bias-language-check:
  extends:
    - .go-verify-job
    - .rules-default-validation-lane
  image:
    name: ghcr.io/splunk/biased_lang:1.0.0@sha256:38555f026715f0b7ab206cd300fcdcc88c7e8ab0e29ce389e371b4262b46e325
    entrypoint: [""]
  before_script: []
  variables:
    # The linter uses these GitHub-named variables to identify CI runs and to
    # return a non-zero status when biased terms are found.
    GITHUB_REPO: $CI_PROJECT_PATH
    GITHUB_URL: $CI_SERVER_URL
  script:
    - cd /biased-lang
    - python3 run_json.py --path="${CI_PROJECT_DIR}" --err_file=err_biased_lang.log
  after_script:
    - cp /biased-lang/biased-language-summary.json "${CI_PROJECT_DIR}/" || true
    - cp /biased-lang/biased-language.codeclimate.json "${CI_PROJECT_DIR}/" || true
  artifacts:
    when: always
    paths:
      - biased-language-summary.json
      - biased-language.codeclimate.json
    reports:
      codequality: biased-language.codeclimate.json

format-and-vet:
  extends:
    - .go-verify-job
    - .rules-default-validation-lane
  script:
    - make fmt
    - make vet
    - git diff --exit-code

unit-tests:
  extends:
    - .go-test-job
    - .rules-default-validation-lane
  needs:
    - format-and-vet
  variables:
    GOFLAGS: ""
  script:
    - make setup/ginkgo
    - make test
    - go tool cover -func=coverage.out | tee coverage-summary.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage-summary.txt
      - unit_test.xml
    reports:
      junit: unit_test.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

kubectl-splunk-tests:
  extends:
    - .go-test-job
    - .kubectl-splunk-python-job
    - .rules-default-validation-lane
  script:
    - cd tools/kubectl-splunk
    - coverage run -m unittest discover -s tests
    - coverage report | tee "$CI_PROJECT_DIR/kubectl-splunk-coverage-summary.txt"
    - coverage xml -o "$CI_PROJECT_DIR/kubectl-splunk-coverage.xml"
  artifacts:
    when: always
    paths:
      - kubectl-splunk-coverage-summary.txt
      - kubectl-splunk-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: kubectl-splunk-coverage.xml

helm-chart-tests:
  extends:
    - .go-test-job
    - .rules-default-validation-lane
  variables:
    HELM_OPERATOR_CHART: helm-chart/splunk-operator
    HELM_UF_CHART: helm-chart/splunk-universalforwarder
    HELM_DATA_HOME: ${CI_PROJECT_DIR}/.helm-data
    HELM_UNITTEST_VERSION: "v1.0.3"
  cache:
    key: helm-unittest-${HELM_UNITTEST_VERSION}
    paths:
      - .helm-data/plugins/
  script:
    - make setup/helm-unittest
    - make helm-lint SPLUNK_GENERAL_TERMS="--accept-sgt-current-at-splunk-com"
    - helm unittest --output-file helm-unittest-operator-junit.xml --output-type JUnit ${HELM_OPERATOR_CHART}
    - helm unittest --output-file helm-unittest-uf-junit.xml --output-type JUnit ${HELM_UF_CHART}
  artifacts:
    when: always
    paths:
      - helm-unittest-operator-junit.xml
      - helm-unittest-uf-junit.xml
    reports:
      junit:
        - helm-unittest-operator-junit.xml
        - helm-unittest-uf-junit.xml

gosec-scan:
  extends:
    - .security-job
    - .rules-qualification-lane
  needs:
    - format-and-vet
  script:
    - |
      set -eu
      status="passed"
      if ! make code/sec > gosec-results.txt 2>&1; then
        status="failed"
      fi
      printf '%s\n' "${status}" > gosec-status.txt
      cat gosec-results.txt
  artifacts:
    when: always
    paths:
      - gosec-results.txt
      - gosec-status.txt

govulncheck-scan:
  extends:
    - .security-job
    - .rules-qualification-lane
  needs:
    - format-and-vet
  script:
    - |
      set -eu
      status="passed"
      if ! make code/vulncheck > govulncheck-results.txt 2>&1; then
        status="failed"
      fi
      printf '%s\n' "${status}" > govulncheck-status.txt
      cat govulncheck-results.txt
  artifacts:
    when: always
    paths:
      - govulncheck-results.txt
      - govulncheck-status.txt
